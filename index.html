  --rule:#E7E2D7;
  --rule-soft:#EFEBE2;

  /* ink */
  --ink:#242420;
  --ink-80:#4A4A44;
  --ink-60:#6E6E66;
  --ink-45:#6E6C65;          /* 4.95:1 on paper — small text passes AA */
  --ink-30:#8E8B83;          /* 3.2:1 — non-essential marks only */
  --ink-faint:#B4B1A7;       /* decorative rules and disabled marks */

  /* accents — used sparingly, never all at once */
  --olive:#7C8264;
  --clay:#B56F50;
  --sage:#B8BBA7;
  --olive-ink:#6A6F56;       /* accents when used as small text */
  --clay-ink:#995E44;
  --olive-wash:#EDEFE6;
  --clay-wash:#F5EAE3;

  /* type */
  /* One family, worked hard: weight, size, tracking and case carry the hierarchy. */
  --display:'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --sans:'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;

  /* metrics */
  --pad:22px;
  --tab-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
}
[data-theme="night"]{
  --paper:#16150F;
  --cream:#1E1D16;
  --stone:#3A382E;
  --rule:#2E2C23;
  --rule-soft:#242219;
  --ink:#EFEADD;
  --ink-80:#CFC9BA;
  --ink-60:#A6A093;
  --ink-45:#948F80;
  --ink-30:#6C6756;
  --ink-faint:#4A473C;
  --olive-ink:#9BA184;
  --clay-ink:#CC8467;
  --olive-wash:#22271C;
  --clay-wash:#2B1F18;
  --sage:#8E9280;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--sans);
  font-size:14px;
  line-height:1.6;
  letter-spacing:-.002em;
  color:var(--ink);
  background:#CFC8BB;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  overscroll-behavior:none;
}
figure,ol,ul,p,h1,h2,h3{margin:0}
img{max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;color:inherit}
input,textarea{background:none;border:0;outline:none}
a{color:inherit}
::selection{background:var(--stone);color:var(--ink)}

/* ---------- device stage ---------- */
#stage{
  min-height:100%;
  display:flex;align-items:center;justify-content:center;
  padding:28px 16px;
  background:
    radial-gradient(120% 90% at 50% 0%, #DCD5C7 0%, #C6BFB1 55%, #B8B1A3 100%);
}
#device{
  position:relative;
  width:min(402px,100%);
  height:min(874px, calc(100dvh - 56px));
  border-radius:46px;
  background:var(--paper);
  overflow:hidden;
  box-shadow:
    0 0 0 1px rgba(36,36,32,.14),
    0 2px 0 0 rgba(255,255,255,.5) inset,
    0 34px 70px -22px rgba(46,42,34,.5),
    0 4px 14px rgba(46,42,34,.18);
  isolation:isolate;
  transition:background .4s var(--ease);
}
@media (max-width:520px), (max-height:700px){
  #stage{padding:0;background:var(--paper)}
  #device{width:100%;height:100dvh;border-radius:0;box-shadow:none}
}
/* Installed to the home screen: no browser chrome, so drop our mock status bar
   and let the real one sit above the app. */
@media (display-mode:standalone), (display-mode:fullscreen){
  #stage{padding:0;background:var(--paper)}
  #device{width:100%;height:100dvh;border-radius:0;box-shadow:none}
  #statusbar{display:none}
  #view{padding-top:env(safe-area-inset-top,0px)}
  .topbar{top:env(safe-area-inset-top,0px)}
  body{overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
  input,textarea{-webkit-user-select:text;user-select:text}
}

/* paper grain — barely there */
#device::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:60;
  opacity:.05;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");
}
[data-theme="night"] #device::after{opacity:.07;mix-blend-mode:screen}

#app{position:absolute;inset:0;display:flex;flex-direction:column}

/* ---------- status bar ---------- */
#statusbar{
  height:44px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 30px 0 34px;font-size:12.5px;font-weight:600;letter-spacing:.01em;
  color:var(--ink);z-index:30;pointer-events:none;
}
#statusbar .sb-r{display:flex;gap:5px;align-items:center;opacity:.9}
@media (max-width:520px){ #statusbar{display:none} #view{padding-top:env(safe-area-inset-top,0px)} }

/* ---------- scroll view ---------- */
#view{
  flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;position:relative;
  scrollbar-width:none;
}
#view::-webkit-scrollbar{display:none}
.screen{min-height:100%;display:flex;flex-direction:column;animation:sc .34s var(--ease-out) both}
@keyframes sc{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pad{padding-left:var(--pad);padding-right:var(--pad)}
.grow{flex:1 1 auto}
.tab-space{height:calc(var(--tab-h) + var(--safe-b) + 14px);flex:0 0 auto}

/* ---------- typography ---------- */
.d1,.d2,.d3,.d4,.d5{font-family:var(--display);color:var(--ink);margin:0}
.d1{font-size:34px;line-height:1.08;letter-spacing:-.042em;font-weight:300}
.d2{font-size:25px;line-height:1.16;letter-spacing:-.036em;font-weight:300}
.d3{font-size:19.5px;line-height:1.24;letter-spacing:-.028em;font-weight:400}
.d4{font-size:16px;line-height:1.32;letter-spacing:-.018em;font-weight:600}
.d5{font-size:13.5px;line-height:1.38;letter-spacing:-.008em;font-weight:600}
.serif-it{font-family:var(--display);font-style:italic;font-weight:300;letter-spacing:-.008em}

.micro{
  font-size:9.5px;font-weight:600;letter-spacing:.19em;text-transform:uppercase;
  color:var(--ink-45);
}
.micro.ink{color:var(--ink)}
.body{font-size:14.5px;line-height:1.66;color:var(--ink-80);letter-spacing:-.003em}
.sm{font-size:13px;line-height:1.62;color:var(--ink-60)}
.xs{font-size:11.5px;line-height:1.55;color:var(--ink-45);letter-spacing:.002em}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}
.mut{color:var(--ink-45)}

/* ---------- rules & structure ---------- */
.rule{height:1px;background:var(--rule);border:0;margin:0}
.rule-soft{height:1px;background:var(--rule-soft);border:0;margin:0}
.hair{border-top:1px solid var(--rule)}
.sect{padding-top:34px}
.sect-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sect-head .micro{white-space:nowrap}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:25;background:var(--paper);
  display:flex;align-items:center;gap:10px;
  min-height:52px;padding:6px var(--pad) 10px;
  transition:box-shadow .2s var(--ease),border-color .2s;
  border-bottom:1px solid transparent;
}
.topbar.stuck{border-bottom-color:var(--rule)}
.topbar .tb-title{font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:-.01em;flex:1;text-align:center;
  opacity:0;transition:opacity .22s var(--ease)}
.topbar.stuck .tb-title{opacity:1}
.tb-act{display:flex;gap:2px;align-items:center}

.iconbtn{
  width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:50%;color:var(--ink);flex:0 0 auto;
  transition:background .18s var(--ease),transform .18s var(--ease);
}
.iconbtn:active{transform:scale(.9)}
@media (hover:hover){.iconbtn:hover{background:var(--cream)}}
.iconbtn[disabled]{opacity:.3;pointer-events:none}
.iconbtn.on{color:var(--clay)}

/* ---------- wordmark ---------- */
.wordmark{
  font-family:var(--display);font-weight:500;font-size:16px;letter-spacing:.34em;
  text-transform:uppercase;color:var(--ink);padding-left:.34em;
}
.wordmark.big{font-size:26px;letter-spacing:.42em;font-weight:400}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  min-height:52px;padding:0 26px;border-radius:2px;
  font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  background:var(--ink);color:var(--paper);
  transition:transform .16s var(--ease),opacity .16s;
  width:100%;
}
.btn:active{transform:scale(.985);opacity:.9}
.btn.ghost{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px var(--stone)}
.btn.quiet{background:var(--cream);color:var(--ink)}
.btn[disabled]{opacity:.32;pointer-events:none}
.btn.sm{min-height:42px;font-size:13px;padding:0 18px;width:auto}
.btn.clay{background:var(--clay);color:#fff}

.tbtn{
  display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;
  letter-spacing:.05em;color:var(--ink);padding:10px 0;min-height:44px;
  border-bottom:1px solid var(--ink);align-self:flex-start;
}
.tbtn.mutlink{color:var(--ink-60);border-bottom-color:var(--stone);font-weight:500}
.linky{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;
  text-decoration-color:var(--ink-30)}

/* ---------- index list (the core structural device) ---------- */
.ix{border-top:1px solid var(--rule)}
.ix-row{
  display:flex;align-items:center;gap:15px;width:100%;text-align:left;
  padding:17px 0;border-bottom:1px solid var(--rule);min-height:60px;
  transition:opacity .15s;
}
.ix-row:active{opacity:.55}
.ix-n{font-family:var(--display);font-size:10.5px;font-weight:500;color:var(--ink-faint);letter-spacing:.04em;width:16px;flex:0 0 auto;
  font-variant-numeric:tabular-nums;padding-top:2px}
.ix-ic{width:22px;flex:0 0 auto;color:var(--ink-60);display:flex;align-items:center;justify-content:center}
.ix-b{flex:1;min-width:0;display:block}
.ix-t{display:block;font-size:14px;font-weight:500;letter-spacing:-.012em;color:var(--ink)}
.ix-s{display:block;font-size:12px;color:var(--ink-45);margin-top:3px;letter-spacing:-.002em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ix-r{flex:0 0 auto;color:var(--ink-30);display:flex;align-items:center;gap:10px;font-size:13px}
.ix-r svg{color:var(--ink-faint)}

/* ---------- chips / toggles (restrained) ---------- */
.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 14px;
  border-radius:2px;font-size:12px;font-weight:500;letter-spacing:-.005em;color:var(--ink-60);
  box-shadow:inset 0 0 0 1px var(--rule);background:none;transition:all .16s var(--ease);
}
.chip[aria-pressed="true"],.chip.on{color:var(--paper);background:var(--ink);box-shadow:none}
.chip:active{transform:scale(.97)}
.chip.acc[aria-pressed="true"]{background:var(--olive)}

.seg{display:flex;gap:20px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{
  font-size:11.5px;font-weight:600;letter-spacing:.05em;color:var(--ink-60);white-space:nowrap;
  padding:10px 0 8px;border-bottom:1.5px solid transparent;transition:color .18s,border-color .18s;min-height:40px;
}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

/* ---------- form ---------- */
.field{border-bottom:1px solid var(--rule);padding:14px 0 12px;position:relative}
.field label{display:block;margin-bottom:5px}
.field input,.field textarea,.field select{
  width:100%;font-size:15px;color:var(--ink);line-height:1.5;padding:0;letter-spacing:-.008em;
  background:none;border:0;resize:none;appearance:none;
}
.field textarea{min-height:26px}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-30)}
input::placeholder,textarea::placeholder{color:var(--ink-30)}
.field.focus{border-bottom-color:var(--ink)}
.field .serifin{font-family:var(--display);font-size:22px;font-weight:300;line-height:1.24;letter-spacing:-.032em}
.field-err{color:var(--clay-ink);font-size:12px;margin-top:5px}
.fieldset{margin-top:26px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}

.switch{
  width:44px;height:26px;border-radius:13px;background:var(--stone);position:relative;flex:0 0 auto;
  transition:background .2s var(--ease);
}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:var(--paper);transition:transform .22s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.switch[aria-checked="true"]{background:var(--olive)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

.check{
  width:21px;height:21px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--stone);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:transparent;
  transition:all .2s var(--ease);
}
.check.on{background:var(--ink);box-shadow:none;color:var(--paper);animation:pop .3s var(--ease-out)}
@keyframes pop{0%{transform:scale(1)}42%{transform:scale(.84)}100%{transform:scale(1)}}

/* ---------- recipe media ---------- */
.ph{position:relative;overflow:hidden;background:var(--cream);display:block}
.ph img{width:100%;height:100%;object-fit:cover;display:block;
  animation:reveal .7s var(--ease-out) both}
@keyframes reveal{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
/* typographic cover — used until the user adds a photo */
.tcov{position:absolute;inset:0;display:flex;align-items:flex-end;padding:14px;overflow:hidden}
.tcov .tc-i{font-family:var(--display);font-size:13px;font-weight:500;line-height:1.28;letter-spacing:-.02em;
  color:var(--ink-80);position:relative;z-index:2;max-height:100%;overflow:hidden}
.tcov .tc-m{font-family:var(--display);font-size:10px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;
  color:var(--ink-45);position:relative;z-index:2;padding-left:.26em}
.tcov svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;opacity:.5}

.r-tile{display:block;width:100%;text-align:left}
.r-tile .ph{aspect-ratio:4/5;margin-bottom:10px}
.ph.feat{aspect-ratio:5/4}
.r-tile h3{font-family:var(--display);font-size:14.5px;font-weight:500;line-height:1.3;letter-spacing:-.022em;
  margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.r-tile .meta{margin-top:5px}
.tilegrid{display:grid;grid-template-columns:1fr 1fr;gap:26px 16px}

.meta{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-45);font-weight:600}
.dot{display:inline-block;width:2px;height:2px;border-radius:50%;background:currentColor;
  vertical-align:middle;margin:0 6px 2px}

/* ---------- bottom nav ---------- */
#tabbar{
  flex:0 0 auto;z-index:40;background:var(--paper);
  border-top:1px solid var(--rule);
  padding-bottom:var(--safe-b);
  display:flex;align-items:stretch;
}
#tabbar.hide{display:none}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  height:var(--tab-h);color:var(--ink-60);transition:color .2s var(--ease);position:relative;
}
.tab .tl{font-size:8.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.tab[aria-current="page"]{color:var(--ink)}
.tab:active{opacity:.6}
.tab.add{color:var(--ink)}
.tab.add .knob{
  width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);
  display:flex;align-items:center;justify-content:center;
  transition:transform .22s var(--ease);
}
.tab.add:active .knob{transform:scale(.88)}

/* ---------- sheets & modals ---------- */
#layer{position:absolute;inset:0;z-index:70;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(30,28,22,.32);opacity:0;transition:opacity .3s var(--ease);
  pointer-events:auto;backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px)}
.scrim.in{opacity:1}
.sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:88%;display:flex;flex-direction:column;
  background:var(--paper);border-radius:20px 20px 0 0;pointer-events:auto;
  transform:translateY(101%);transition:transform .38s var(--ease-out);
  box-shadow:0 -18px 44px -18px rgba(40,36,28,.4);
  padding-bottom:var(--safe-b);
}
.sheet.in{transform:none}
.sheet .grab{width:34px;height:3px;border-radius:2px;background:var(--stone);margin:9px auto 4px;flex:0 0 auto}
.sheet-b{overflow-y:auto;padding:6px var(--pad) 26px;scrollbar-width:none}
.sheet-b::-webkit-scrollbar{display:none}
.sheet-h{padding:10px var(--pad) 0;display:flex;align-items:baseline;justify-content:space-between;gap:12px}

.dialog{
  position:absolute;left:26px;right:26px;top:50%;transform:translateY(-46%) scale(.97);opacity:0;
  background:var(--paper);border-radius:4px;pointer-events:auto;padding:26px 24px 22px;
  box-shadow:0 24px 60px -20px rgba(40,36,28,.5);transition:all .28s var(--ease-out);
}
.dialog.in{transform:translateY(-50%) scale(1);opacity:1}

#toast{
  position:absolute;left:var(--pad);right:var(--pad);bottom:calc(var(--tab-h) + var(--safe-b) + 16px);
  z-index:80;pointer-events:none;display:flex;flex-direction:column;gap:8px;align-items:center;
}
.toast{
  background:var(--ink);color:var(--paper);font-size:12.5px;font-weight:500;letter-spacing:-.002em;
  padding:12px 18px;border-radius:2px;max-width:100%;
  animation:tin .3s var(--ease-out) both;display:flex;gap:14px;align-items:center;
  box-shadow:0 10px 26px -10px rgba(30,28,22,.55);
}
.toast .ta{font-weight:600;text-decoration:underline;text-underline-offset:3px;pointer-events:auto;white-space:nowrap}
.toast.out{animation:tout .26s var(--ease) both}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(6px)}}

/* ---------- empty states ---------- */
.empty{padding:8px var(--pad) 0;display:flex;flex-direction:column;flex:1}
.empty .eyebrow{margin-bottom:20px}
.empty h2{margin:0 0 14px;max-width:11ch}
.empty .esub{font-size:14.5px;line-height:1.6;color:var(--ink-60);max-width:30ch;margin:0 0 20px}
.figure{margin:2px 0 22px;color:var(--ink-faint);opacity:.85}
.empty .figure svg{max-height:104px;margin-inline:auto}
.figure svg{display:block;width:100%;height:auto;overflow:visible}

/* ---------- skeleton ---------- */
.sk{background:var(--rule-soft);position:relative;overflow:hidden}
.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shim 1.5s infinite}
@keyframes shim{100%{transform:translateX(100%)}}

/* ---------- misc ---------- */
.stat{font-family:var(--display);font-size:16px;font-weight:400;letter-spacing:-.022em;
  color:var(--ink);font-variant-numeric:tabular-nums}
.stars{display:inline-flex;gap:3px;color:var(--clay)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-60);padding:4px 8px;box-shadow:inset 0 0 0 1px var(--rule);border-radius:2px}
.badge.clay{color:var(--clay-ink);box-shadow:inset 0 0 0 1px rgba(181,111,80,.4)}
.badge.olive{color:var(--olive-ink);box-shadow:inset 0 0 0 1px rgba(124,130,100,.4)}

/* editorial action bar — hairlines, not cards */
.actionbar{display:flex;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.actionbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:15px 4px;color:var(--ink);position:relative;min-height:64px;transition:opacity .16s}
.actionbar button+button::before{content:'';position:absolute;left:0;top:16px;bottom:16px;width:1px;background:var(--rule)}
.actionbar button span{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-60)}
.actionbar button:active{opacity:.5}
.seg-wrap{position:relative}
.seg-wrap::after{content:'';position:absolute;right:0;top:0;bottom:0;width:34px;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--paper) 72%)}
.ix-row .ph{width:46px;height:58px;border-radius:1px}
.ix-row .ph .tc-i{font-size:9px;line-height:1.1}
.ix-row .ph .tcov{padding:6px}
.drag-over{background:var(--olive-wash)!important;}
.dragging{opacity:.4}

/* --- touch targets: visually small controls get a 44px hit area --- */
.check,.switch,.iconbtn{position:relative}
.check::before,.switch::before,.iconbtn::before{content:'';position:absolute;left:50%;top:50%;

/* ==========================================================================
   NUTRITION — computed, never invented.
   --------------------------------------------------------------------------
   Every kilojoule this app displays can be traced to one of exactly three
   things, and nothing else:

/* Direct mass conversions — exact, no assumptions. */
const MASS_TO_G = { g:1, gram:1, grams:1, kg:1000, kilogram:1000, kilograms:1000,

  lb:453.59237, lbs:453.59237, pound:453.59237, pounds:453.59237 };

/* Volume units differ by country. Australia's tablespoon is 20 ml — four
   teaspoons, not three — and the metric cup is 250 ml. Getting this wrong
   is a 33% error on every tablespoon in the recipe. */
const SPOON_SYSTEMS = {
  'au':   {label:'Australia / NZ', tsp:5,    tbsp:20,   cup:250,   note:'20 ml tablespoon, 250 ml cup'},
  'metric':{label:'Metric (UK/EU)',tsp:5,    tbsp:15,   cup:250,   note:'15 ml tablespoon, 250 ml cup'},
  'us':   {label:'United States',  tsp:4.929,tbsp:14.787,cup:236.588,note:'14.8 ml tablespoon, 237 ml cup'},
};
function spoons(){ return SPOON_SYSTEMS[S.prefs.spoons]||SPOON_SYSTEMS.au; }
function volToMl(unit){
  const u=String(unit||'').toLowerCase().replace(/\.$/,'').trim();
  const s=spoons();
  const map={ ml:1, millilitre:1, milliliter:1, l:1000, litre:1000, liter:1000,
    tsp:s.tsp, teaspoon:s.tsp, teaspoons:s.tsp,
    tbsp:s.tbsp, tbs:s.tbsp, tablespoon:s.tbsp, tablespoons:s.tbsp,
    cup:s.cup, cups:s.cup,
    'fl oz':29.5735, floz:29.5735, pt:568.261, pint:568.261 };

}
function massToG(qty,unit){
  const n=parseQty(qty); if(n==null) return null;
  const u=String(unit||'').toLowerCase().replace(/\.$/,'').trim();
  if(MASS_TO_G[u]!=null) return n*MASS_TO_G[u];
  return null;
}

/* FoodData Central nutrient numbers we care about. */
const FDC_NUTRIENTS = { '208':'kcal','1008':'kcal', '203':'protein','1003':'protein',
  '205':'carbs','1005':'carbs', '204':'fat','1004':'fat', '291':'fibre','1079':'fibre',
  '269':'sugars','2000':'sugars', '307':'sodium','1093':'sodium' };
const NUT_KEYS=['kcal','protein','carbs','fat','fibre','sugars','sodium'];
const NUT_LABEL={kcal:'Energy',protein:'Protein',carbs:'Carbs',fat:'Fat',fibre:'Fibre',sugars:'Sugars',sodium:'Sodium'};
const NUT_UNIT={kcal:'kcal',protein:'g',carbs:'g',fat:'g',fibre:'g',sugars:'g',sodium:'mg'};

function fdcKey(){ return (S.prefs.fdcKey||'').trim()||'DEMO_KEY'; }
function per100From(foodNutrients){
  const out={};
  (foodNutrients||[]).forEach(n=>{
    const num=String(n.nutrientNumber||(n.nutrient&&n.nutrient.number)||n.number||'');
    const key=FDC_NUTRIENTS[num]; if(!key) return;
    const v=(n.value!=null?n.value:n.amount);
    if(v==null||out[key]!=null) return;
    out[key]=Math.round(Number(v)*100)/100;
  });
  return out;
}
async function fdcSearch(query){
  const url='https://api.nal.usda.gov/fdc/v1/foods/search?api_key='+encodeURIComponent(fdcKey())
    +'&query='+encodeURIComponent(query)+'&dataType=Foundation,SR%20Legacy,Survey%20(FNDDS)&pageSize=10';
  const res=await fetch(url);
  if(res.status===403) throw new Error('key');
  if(res.status===429) throw new Error('rate');
  if(!res.ok) throw new Error('http'+res.status);
  const j=await res.json();
  return (j.foods||[]).map(f=>({
    fdcId:f.fdcId, desc:f.description, brand:f.brandName||'', type:f.dataType,
    per100:per100From(f.foodNutrients)
  })).filter(f=>f.per100.kcal!=null);
}
async function fdcDetail(fdcId){
  const url='https://api.nal.usda.gov/fdc/v1/food/'+encodeURIComponent(fdcId)
    +'?api_key='+encodeURIComponent(fdcKey())+'&format=full';
  const res=await fetch(url); if(!res.ok) throw new Error('http'+res.status);
  const j=await res.json();
  return {
    fdcId:j.fdcId, desc:j.description, per100:per100From(j.foodNutrients),
    portions:(j.foodPortions||[]).map(p=>({
      grams:p.gramWeight,
      amount:p.amount,
      unit:(p.measureUnit&&p.measureUnit.name!=='undetermined'?p.measureUnit.name:'')||p.modifier||'',
      label:[p.amount,(p.measureUnit&&p.measureUnit.name!=='undetermined'?p.measureUnit.name:''),p.modifier]
        .filter(Boolean).join(' ').trim()||'portion'
    })).filter(p=>p.grams>0)
  };
}

/* Resolve one ingredient to grams. Returns {grams, source} or null.
   `source` is shown to the user so the provenance is never hidden. */
function ingredientGrams(i){
  const link=i.nut;
  const direct=massToG(i.qty,i.unit);
  if(direct!=null) return {grams:direct, source:'you typed a weight'};
  if(link && link.gramsPerUnit!=null){
    const n=parseQty(i.qty);
    if(n!=null) return {grams:n*link.gramsPerUnit, source:link.gramSource||'saved portion weight'};
  }
  if(link && link.portions && link.portions.length){
    const u=String(i.unit||'').toLowerCase().trim();
    const n=parseQty(i.qty);
    if(n!=null && u){
      const hit=link.portions.find(p=>String(p.unit||'').toLowerCase()===u
        || String(p.label||'').toLowerCase().includes(u));
      if(hit) return {grams:n*(hit.grams/(hit.amount||1)), source:'USDA portion: '+hit.label+' = '+hit.grams+' g'};
    }
  }
  return null;   /* deliberately unresolved — never guessed */
}

function computeNutrition(r){
  const items=allIngredients(r).filter(x=>x.name && x.name.trim());
  const serves=parseQty(r.serves)||0;
  const totals={}; NUT_KEYS.forEach(k=>totals[k]=0);
  const lines=[]; let matched=0, gramsKnown=0;
  items.forEach(i=>{
    const g=ingredientGrams(i);
    const link=i.nut;
    if(!link || !link.per100 || link.per100.kcal==null || !g){
      lines.push({i, ok:false, why: !link?'not matched to a food yet' : (!g?'no weight for this quantity':'no energy value')});
      return;
    }
    const row={i, ok:true, grams:g.grams, gramSource:g.source, desc:link.desc, fdcId:link.fdcId, values:{}};
    NUT_KEYS.forEach(k=>{
      const v=link.per100[k];
      if(v!=null){ const amt=v*g.grams/100; row.values[k]=amt; totals[k]+=amt; }
    });
    lines.push(row); matched++; gramsKnown+=g.grams;
  });
  const perServe={};
  NUT_KEYS.forEach(k=>{ perServe[k]= serves>0 ? totals[k]/serves : null; });
  return {
    lines, totals, perServe, serves,
    matched, total:items.length,
    complete: items.length>0 && matched===items.length && serves>0,
    coverage: items.length? matched/items.length : 0,
    gramsKnown: Math.round(gramsKnown),
    manual: r.nutritionMode==='manual',
  };
}
/* What the app is willing to display. Below this it shows the shortfall

const NUTRITION_MIN_COVERAGE = 0.8;
function nutritionHeadline(r){
  if(r.nutritionMode==='manual'){
    const c=Number(r.nutrition.cal)||0;
    return c?{kcal:c, manual:true, complete:true}:null;
  }
  const n=computeNutrition(r);
  if(!n.serves || n.matched===0) return null;
  return {kcal:n.perServe.kcal, complete:n.complete, coverage:n.coverage,
          matched:n.matched, total:n.total, n};
}

/* Typography + geometry only. Never fake food imagery. */
function coverArt(seed,accent,fit){
  const a=accent||'var(--stone)';
  let h=0; for(let i=0;i<String(seed).length;i++) h=(h*31+String(seed).charCodeAt(i))>>>0;
  const v=h%5;
  const g=`stroke="${a}" fill="none" stroke-width=".9" vector-effect="non-scaling-stroke"`;
  const shapes=[
    /* concentric arcs breaking the frame */
    `<g ${g}><circle cx="70" cy="30" r="52"/><circle cx="70" cy="30" r="38" opacity=".7"/><circle cx="70" cy="30" r="24" opacity=".45"/></g>
     <g ${g} opacity=".5"><path d="M0 70h100"/></g>`,
    /* a single long sweep, like a spoon trail */
    `<g ${g}><path d="M-10 92C18 44 44 78 110 8"/><path d="M-10 100C18 52 44 86 110 16" opacity=".55"/></g>
     <g ${g} opacity=".8"><circle cx="20" cy="24" r="11"/></g>`,
    /* a card, ruled — the index card in a family folder */
    `<g ${g}><rect x="16" y="10" width="68" height="80"/>
       <path d="M26 30h48M26 42h48M26 54h30" opacity=".7"/><path d="M16 66h68" opacity=".5"/>
       <circle cx="66" cy="78" r="8" opacity=".65"/></g>`,
    /* nested frames, plate-like */
    `<g ${g}><rect x="10" y="10" width="80" height="80"/><rect x="22" y="22" width="56" height="56" opacity=".6"/></g>
     <g ${g} opacity=".85"><circle cx="50" cy="50" r="16"/></g>`,
    /* offset half-round and a rule — quiet, asymmetric */
    `<g ${g}><path d="M14 96V40a36 36 0 0 1 72 0v56"/><path d="M30 96V44a20 20 0 0 1 40 0v52" opacity=".55"/></g>
     <g ${g} opacity=".5"><path d="M0 24h100"/></g>`,
  ];
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="${fit==='meet'?'xMidYMid meet':'xMidYMid slice'}" aria-hidden="true">${shapes[v]}</svg>`;
}
function initials(t){
  const w=String(t||'').trim().split(/\s+/).filter(Boolean);
  if(!w.length) return '—';
  return (w[0][0]+(w[1]?w[1][0]:'')).toUpperCase();
}

/* `titled` = the title is NOT shown next to this image, so set it on the cover.

let scrollMem={};
function render(keepScroll){
  const view=$('#view');
  const prevKey=view.dataset.key;
  if(prevKey) scrollMem[prevKey]=view.scrollTop;
  const key=S.route.name+JSON.stringify(S.route.params);
  const fn=SCREENS[S.route.name]||SCREENS.error;
  view.innerHTML=fn(S.route.params||{});
  view.dataset.key=key;
  renderTabs();
  $('#device').dataset.theme=S.theme;
  view.scrollTop = keepScroll ? (scrollMem[key]||0) : 0;
  onScroll();
  afterRender();
  /* Every mutation in this app is followed by a render, so this is the one
     honest place to hook persistence. It is debounced and the payload is text
     only — photos live in storage — so over-firing costs nothing. */
  scheduleSave();
}

  $$('[data-autofocus]').forEach(el=>setTimeout(()=>el.focus(),120));
  $$('textarea[data-grow]').forEach(t=>{autogrow(t);});

}
function autogrow(t){ t.style.height='auto'; t.style.height=Math.max(38,t.scrollHeight)+'px'; }

let layerStack=[];
function openSheet(html,opts={}){
  const layer=$('#layer'); layer.style.pointerEvents='auto';
  const wrap=document.createElement('div');
  wrap.innerHTML=`<div class="scrim" data-dismiss></div><section class="sheet" role="dialog" aria-modal="true" ${opts.label?`aria-label="${esc(opts.label)}"`:''}><div class="grab"></div>${html}</section>`;
  layer.appendChild(wrap);
  layerStack.push(wrap);
  requestAnimationFrame(()=>{ wrap.querySelector('.scrim').classList.add('in'); wrap.querySelector('.sheet').classList.add('in'); });
  const f=wrap.querySelector('[data-autofocus]'); if(f) setTimeout(()=>f.focus(),260);
  return wrap;
}
function openDialog(html,opts={}){
  const layer=$('#layer'); layer.style.pointerEvents='auto';
  const wrap=document.createElement('div');
  wrap.innerHTML=`<div class="scrim" data-dismiss></div><section class="dialog" role="alertdialog" aria-modal="true" ${opts.label?`aria-label="${esc(opts.label)}"`:''}>${html}</section>`;
  layer.appendChild(wrap);
  layerStack.push(wrap);
  requestAnimationFrame(()=>{ wrap.querySelector('.scrim').classList.add('in'); wrap.querySelector('.dialog').classList.add('in'); });
  const f=wrap.querySelector('[data-autofocus]'); if(f) setTimeout(()=>f.focus(),260);
  return wrap;
}
function closeLayer(all){
  const w=layerStack.pop(); if(!w) return;
  const s=w.querySelector('.sheet')||w.querySelector('.dialog');
  w.querySelector('.scrim').classList.remove('in');
  if(s){ s.classList.remove('in'); }
  setTimeout(()=>{ w.remove(); if(!layerStack.length) $('#layer').style.pointerEvents='none'; if(all&&layerStack.length) closeLayer(true); },300);
}

function toast(msg,action){

  t.innerHTML=`<span>${esc(msg)}</span>${action?`<button class="ta" data-toast-action="${id}">${esc(action.label)}</button>`:''}`;
  if(action) t.dataset.fn=id, (toast._fns=toast._fns||{})[id]=action.fn;

}

    </div>`,{label:title});

/* --------------------------------------------------------- image capture */
function pickImage(cb,capture){
  const i=document.createElement('input');
  i.type='file'; i.accept='image/*'; if(capture) i.capture='environment';
  i.onchange=()=>{
    const f=i.files&&i.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=async ()=>{
      /* Phone cameras produce 4-12 MB files; nothing here needs that. Shrink
         first, then hand it to storage if we have somewhere to put it. */
      const small = await shrinkImage(r.result);
      const stored = await uploadImage(small);
      cb(stored, f);
      scheduleSave();
    };
    r.onerror=()=>toast('That image could not be read.');
    r.readAsDataURL(f);
  };
  i.click();
}

/* ---- quantity scaling: original is always recoverable ---- */
function parseQty(q){
  if(q==null||q==='') return null;
  const s=String(q).trim();
  const uni={'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125};
  let m=s.match(/^(\d+)?\s*([½¼¾⅓⅔⅛])/);
  if(m) return (Number(m[1])||0)+uni[m[2]];
  m=s.match(/^(\d+)\s+(\d+)\/(\d+)/); if(m) return Number(m[1])+Number(m[2])/Number(m[3]);
  m=s.match(/^(\d+)\/(\d+)/); if(m) return Number(m[1])/Number(m[2]);
  m=s.match(/^(\d+(?:[.,]\d+)?)/); if(m) return Number(m[1].replace(',','.'));
  return null;
}
function fmtQty(n){
  if(n==null||isNaN(n)) return '';
  const r=Math.round(n*100)/100;
  const whole=Math.floor(r), frac=r-whole;
  const map=[[.125,'⅛'],[.25,'¼'],[1/3,'⅓'],[.5,'½'],[2/3,'⅔'],[.75,'¾']];
  for(const [v,g] of map){ if(Math.abs(frac-v)<0.03) return (whole?whole+' ':'')+g; }
  if(Math.abs(frac)<0.03) return String(whole);
  return String(Math.round(r*10)/10);
}
function scaleQty(q,mult){
  const n=parseQty(q); if(n==null) return q;
  const scaled=n*mult;
  const rest=String(q).replace(/^\s*(\d+\s*[½¼¾⅓⅔⅛]|\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?|[½¼¾⅓⅔⅛])\s*/,'');
  return (fmtQty(scaled)+(rest?' '+rest:'')).trim();
}
/* metric ⇄ imperial, only where a clean conversion exists */
const CONV={g:{to:'oz',f:0.03527},kg:{to:'lb',f:2.2046},ml:{to:'fl oz',f:0.03381},l:{to:'pt',f:2.1134},
  oz:{to:'g',f:28.35},lb:{to:'kg',f:0.4536},'fl oz':{to:'ml',f:29.57},cm:{to:'in',f:0.3937}};
function convertUnit(qty,unit,to){
  const u=String(unit||'').toLowerCase().trim();
  const metric=['g','kg','ml','l','cm'], imperial=['oz','lb','fl oz','in'];
  const want=to==='imperial'?imperial:metric;
  if(want.includes(u)) return null;
  const c=CONV[u]; if(!c) return null;
  const n=parseQty(qty); if(n==null) return null;
  let v=n*c.f, unitOut=c.to;
  if(unitOut==='g'&&v>=1000){v/=1000;unitOut='kg'}
  const rounded = v>=10 ? Math.round(v) : Math.round(v*10)/10;
  return String(rounded)+' '+unitOut;
}

/* ---- grocery categorisation (word list, not recipe data) ---- */
const CAT_WORDS={

  'Herbs & spices':['basil','parsley','coriander','cilantro','thyme','rosemary','oregano','mint','dill','sage','cumin','paprika','turmeric','cinnamon','nutmeg','cardamom','clove','bay leaf','chilli flakes','pepper corn','peppercorn','salt','pepper','spice','curry powder','garam masala','vanilla','saffron','za\'atar','sumac'],
  'Refrigerated':['milk','butter','cheese','yoghurt','yogurt','cream','egg','eggs','feta','parmesan','mozzarella','ricotta','tofu','tempeh','miso','kefir','sour cream','creme fraiche','halloumi','chicken','beef','pork','lamb','mince','bacon','sausage','fish','salmon','prawn','shrimp','tuna'],
  'Bakery':['bread','sourdough','bun','roll','tortilla','pita','baguette','wrap','croissant','brioche','naan','bagel'],
  'Frozen':['frozen','ice cream','peas frozen','puff pastry'],

}

function weekStart(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x.toISOString().slice(0,10); }
function weekDays(startISO){ return Array.from({length:7},(_,i)=>{ const d=new Date(startISO+'T00:00:00'); d.setDate(d.getDate()+i); return d.toISOString().slice(0,10); }); }

/* ---- history ---- */
function markCooked(id,extra={}){

  r.cookCount=(r.cookCount||0)+1;
  S.history.unshift(Object.assign({id:uid('h'),recipeId:id,date:todayISO(),rating:0,notes:'',servings:r.serves||'',forWho:'',photo:'',again:null},extra));
}

/* ---- related, from the user's own library only ---- */
function relatedTo(r){
  const mine=liveRecipes().filter(x=>x.id!==r.id);
  const myIng=new Set(allIngredients(r).map(i=>normIng(i.name)).filter(Boolean));
  return mine.map(x=>{
    let s=0;
    x.tags.forEach(t=>{ if(r.tags.includes(t)) s+=3; });
    x.mealTypes.forEach(t=>{ if(r.mealTypes.includes(t)) s+=2; });
    if(x.cuisine&&x.cuisine===r.cuisine) s+=3;
    x.collections.forEach(c=>{ if(r.collections.includes(c)) s+=4; });
    allIngredients(x).forEach(i=>{ if(myIng.has(normIng(i.name))) s+=1; });
    return {x,s};
  }).filter(o=>o.s>0).sort((a,b)=>b.s-a.s).slice(0,4).map(o=>o.x);
}

/* ---- pantry matching, library-only ---- */
function pantryMatches(){
  const have=new Set(S.pantry.map(p=>normIng(p.name)));
  return liveRecipes().map(r=>{
    const ings=allIngredients(r).filter(i=>i.name);
    if(!ings.length) return null;
    const missing=ings.filter(i=>!have.has(normIng(i.name))&&![...have].some(h=>h&&normIng(i.name).includes(h)));
    return {r,missing:missing.length,total:ings.length,missingNames:missing.map(m=>m.name)};
  }).filter(Boolean).filter(m=>m.missing<=2).sort((a,b)=>a.missing-b.missing);
}

/* ==========================================================================
   SEARCH — user library only. Never generates or recommends new recipes.
   ========================================================================== */
function parseQuery(q){
  const raw=String(q||'').toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/\s+/g,' ');
  const f={text:raw,under:null,uncooked:false,platform:null,minRating:0,favourite:false,
           notes:false,recent:false,frequent:false,diets:[],meals:[],terms:[]};
  let t=raw;
  const under=t.match(/(?:under|less than|<|below|in)\s*(\d+)\s*(?:minutes|mins|min)?\b/);
  if(under){ f.under=Number(under[1]); t=t.replace(under[0],' '); }
  const half=t.match(/half an hour/); if(half){ f.under=30; t=t.replace(half[0],' '); }
  if(/\b(haven'?t|not) (yet )?(cooked|made|tried)\b|\bnever cooked\b|\buncooked\b|\bstill to (cook|try)\b/.test(t)){ f.uncooked=true; t=t.replace(/\b(haven'?t|not) (yet )?(cooked|made|tried)\b|\bnever cooked\b|\buncooked\b|\bstill to (cook|try)\b/g,' '); }
  const plat=t.match(/\bfrom (instagram|tiktok|youtube|a website|website|a link|cookbook|a cookbook|screenshot)\b/);
  if(plat){ f.platform=plat[1].replace(/^(a )/,''); t=t.replace(plat[0],' '); }
  if(/\b(highest|top|best)[- ]?rated\b|\bfive star\b|\b5 star\b|\bfavourite|favorite\b/.test(t)){ f.minRating=4; t=t.replace(/\b(highest|top|best)[- ]?rated\b|\bfive star\b|\b5 star\b/g,' '); }
  if(/\bfavourites?\b|\bfavorites?\b|\bloved\b/.test(t)){ f.favourite=true; t=t.replace(/\bfavourites?\b|\bfavorites?\b|\bloved\b/g,' '); }
  if(/\bwith (my )?notes\b|\bannotated\b/.test(t)){ f.notes=true; t=t.replace(/\bwith (my )?notes\b|\bannotated\b/g,' '); }
  if(/\brecently added\b|\bnew(est)?\b|\blast added\b/.test(t)){ f.recent=true; t=t.replace(/\brecently added\b|\bnew(est)?\b|\blast added\b/g,' '); }
  if(/\b(most |frequently |often )?(cooked most|cook most|make most|frequently cooked|go-?to)\b/.test(t)){ f.frequent=true; t=t.replace(/\b(most |frequently |often )?(cooked most|cook most|make most|frequently cooked|go-?to)\b/g,' '); }
  DIETS.forEach(d=>{ const k=d.toLowerCase(); if(t.includes(k)){ f.diets.push(d); t=t.replace(new RegExp(k,'g'),' '); }});
  MEALS.forEach(m=>{ const k=m.toLowerCase(); if(new RegExp('\\b'+k+'\\b').test(t)){ f.meals.push(m); t=t.replace(new RegExp('\\b'+k+'\\b','g'),' '); }});
  t=t.replace(/\b(my|the|a|an|some|something|things?|meals?|dishes|recipes?|for|i|saved|using|with|leftover|that|show|me|find|in|of|and|yet|still|any|all|please|got|have|had|ones?)\b/g,' ');
  f.terms=t.split(/\s+/).map(s=>s.trim()).filter(s=>s.length>2);
  return f;
}
function runSearch(q,extra={}){
  const f=Object.assign(parseQuery(q),{});
  const fl=Object.assign({},S.ui.filters,extra);
  let out=liveRecipes().map(r=>{
    let score=0, hit=false;
    const hay={
      title:(r.title||'').toLowerCase(),
      ing:allIngredients(r).map(i=>i.name).join(' ').toLowerCase(),
      tags:r.tags.join(' ').toLowerCase(),
      notes:(r.notes||'').toLowerCase(),
      src:((r.source||'')+' '+(r.author||'')+' '+(r.platform||'')+' '+(r.url||'')).toLowerCase(),
      cuisine:(r.cuisine||'').toLowerCase(),
      meal:r.mealTypes.join(' ').toLowerCase(),
      method:r.methods.join(' ').toLowerCase(),
      diet:r.diets.join(' ').toLowerCase(),
      coll:r.collections.map(id=>(S.collections.find(c=>c.id===id)||{}).name||'').join(' ').toLowerCase()};
    if(f.terms.length){
      f.terms.forEach(term=>{
        if(hay.title.includes(term)){score+=10;hit=true}
        if(hay.ing.includes(term)){score+=6;hit=true}
        if(hay.tags.includes(term)){score+=5;hit=true}
        if(hay.cuisine.includes(term)){score+=4;hit=true}
        if(hay.coll.includes(term)){score+=4;hit=true}
        if(hay.meal.includes(term)||hay.method.includes(term)||hay.diet.includes(term)){score+=3;hit=true}
        if(hay.notes.includes(term)){score+=3;hit=true}
        if(hay.src.includes(term)){score+=3;hit=true}
      });
      if(!hit) return null;
    } else score=1;
    if(f.under && (!totalTime(r)||totalTime(r)>f.under)) return null;
    if(f.uncooked && r.cookCount) return null;
    if(f.platform){ const p=f.platform.replace('a ',''); if(!hay.src.includes(p)&&!(p==='website'&&/^https?:/.test(r.url||''))) return null; }
    if(f.minRating && (r.rating||0)<f.minRating) return null;
    if(f.favourite && !r.favourite) return null;
    if(f.notes && !(r.notes||'').trim()) return null;
    if(f.diets.length && !f.diets.every(d=>r.diets.includes(d))) return null;
    if(f.meals.length && !f.meals.some(m=>r.mealTypes.includes(m))) return null;
    // structured filters from the filter sheet
    if(fl.diets&&fl.diets.length && !fl.diets.every(d=>r.diets.includes(d))) return null;
    if(fl.meals&&fl.meals.length && !fl.meals.some(m=>r.mealTypes.includes(m))) return null;
    if(fl.methods&&fl.methods.length && !fl.methods.some(m=>r.methods.includes(m))) return null;
    if(fl.maxTime && (!totalTime(r)||totalTime(r)>fl.maxTime)) return null;
    if(fl.minRating && (r.rating||0)<fl.minRating) return null;
    if(fl.collection && !r.collections.includes(fl.collection)) return null;
    if(fl.tag && !r.tags.includes(fl.tag)) return null;
    if(fl.source){ if(fl.source==='mine'&&(r.url||r.platform)) return null;
                   if(fl.source!=='mine'&&!(r.platform||'').toLowerCase().includes(fl.source)) return null; }
    if(fl.uncooked && r.cookCount) return null;
    if(f.recent) score+=new Date(r.added).getTime()/1e12;
    if(f.frequent) score+=(r.cookCount||0)*4;
    score+=(r.rating||0)*0.4;
    return {r,score};
  }).filter(Boolean);
  out.sort((a,b)=>b.score-a.score);
  return out.map(o=>o.r);
}

/* ==========================================================================
   IMPORT — honest extraction. Never invents missing content.
   ========================================================================== */
const QTY_RE=/^\s*(?:[-–—•*·]\s*)?((?:\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?|[½¼¾⅓⅔⅛]|\d+\s*[½¼¾⅓⅔⅛]))\s*([a-zA-Z]{0,12}\b)?\s*(.*)$/;
const UNITS=['g','kg','ml','l','tsp','tbsp','cup','cups','oz','lb','clove','cloves','can','cans','tin','tins','pinch','handful','slice','slices','sprig','sprigs','bunch','stick','sticks','punnet','packet','pack','head','piece','pieces'];

/* Parses text the USER supplies. Anything it cannot determine is left blank
   and flagged as incomplete — it is never filled in with a guess. */
function parseRecipeText(text){
  const out={title:'',groups:[],steps:[],prep:'',cook:'',serves:'',notes:'',incomplete:[]};
  const lines=String(text||'').split(/\r?\n/).map(l=>l.trim());
  if(!lines.filter(Boolean).length) return out;

  // title = first substantial line that isn't a heading keyword
  const firstIdx=lines.findIndex(l=>l&&!/^(ingredients?|method|instructions?|directions?|steps?|you will need|serves|prep|cook)\b/i.test(l));
  if(firstIdx>=0 && lines[firstIdx].length<=90) out.title=lines[firstIdx].replace(/[#*_]/g,'').trim();

  // explicit metadata
  const all=lines.join('\n');
  const sv=all.match(/\b(?:serves|servings?|makes|yield)\s*[:\-]?\s*(\d+(?:\s*[-–]\s*\d+)?)/i); if(sv) out.serves=sv[1];
  const pp=all.match(/\bprep(?:aration)?(?:\s*time)?\s*[:\-]?\s*(\d+)\s*(?:min|minute|m)\b/i); if(pp) out.prep=pp[1];
  const pph=all.match(/\bprep(?:aration)?(?:\s*time)?\s*[:\-]?\s*(\d+)\s*(?:hr|hour|h)\b/i); if(pph&&!pp) out.prep=String(Number(pph[1])*60);
  const ck=all.match(/\bcook(?:ing)?(?:\s*time)?\s*[:\-]?\s*(\d+)\s*(?:min|minute|m)\b/i); if(ck) out.cook=ck[1];
  const ckh=all.match(/\bcook(?:ing)?(?:\s*time)?\s*[:\-]?\s*(\d+)\s*(?:hr|hour|h)\b/i); if(ckh&&!ck) out.cook=String(Number(ckh[1])*60);

  // section split
  let mode='head', curGroup=null;
  const groups=[]; const steps=[]; const notes=[];
  const push=(name)=>{ curGroup={id:uid('g'),name:name||'',items:[]}; groups.push(curGroup); return curGroup; };

  lines.forEach(l=>{
    if(!l) return;
    const bare=l.replace(/[:#*_]/g,'').trim();
    if(/^(ingredients?|you will need|shopping list)$/i.test(bare)){ mode='ing'; push(''); return; }
    if(/^(method|instructions?|directions?|steps?|to make|preparation)$/i.test(bare)){ mode='step'; return; }
    if(/^(notes?|tips?|to serve|storage|make ahead)$/i.test(bare)){ mode='note'; return; }
    // a short bold-ish line inside ingredients = a group heading
    if(mode==='ing' && /^[A-Z][^.!?]{2,34}:?$/.test(bare) && !QTY_RE.exec(l)?.[1]){
      push(bare.replace(/:$/,'')); return;
    }
    if(mode==='ing'){
      if(!curGroup) push('');
      const m=l.match(QTY_RE);
      if(m && m[1]){
        let unit=(m[2]||'').toLowerCase(), rest=m[3]||'';
        if(unit && !UNITS.includes(unit)){ rest=(m[2]+' '+rest).trim(); unit=''; }
        curGroup.items.push({id:uid('i'),qty:m[1],unit,name:rest.trim(),note:'',have:false,sub:'',nut:null});
      } else {
        curGroup.items.push({id:uid('i'),qty:'',unit:'',name:l.replace(/^[-–—•*·]\s*/,''),note:'',have:false,sub:'',nut:null});
      }
      return;
    }
    if(mode==='step'){
      const t=l.replace(/^\s*(?:step\s*)?\d+[.)\]]?\s*/i,'').replace(/^[-–—•*·]\s*/,'').trim();
      if(t.length>2) steps.push({id:uid('s'),text:t,time:extractStepTime(t)});
      return;
    }
    if(mode==='note'){ notes.push(l); return; }
    // heuristic fallback for unlabelled blocks
    if(mode==='head'){
      const m=l.match(QTY_RE);
      if(m&&m[1]&&l.length<70){ if(!curGroup) push('');
        let unit=(m[2]||'').toLowerCase(), rest=m[3]||'';
        if(unit&&!UNITS.includes(unit)){ rest=(m[2]+' '+rest).trim(); unit=''; }
        curGroup.items.push({id:uid('i'),qty:m[1],unit,name:rest.trim(),note:'',have:false,sub:'',nut:null});
      }
      else if(l.length>70) steps.push({id:uid('s'),text:l,time:extractStepTime(l)});
    }
  });
  out.groups=groups.filter(g=>g.items.length).length?groups.filter(g=>g.items.length):[];
  out.steps=steps; out.notes=notes.join('\n');
  if(!out.title) out.incomplete.push('title');
  if(!out.groups.length) out.incomplete.push('ingredients');
  if(!out.steps.length) out.incomplete.push('steps');
  if(!out.serves) out.incomplete.push('serves');
  if(!out.prep&&!out.cook) out.incomplete.push('time');
  const missingQty=out.groups.flatMap(g=>g.items).filter(i=>!i.qty).length;
  if(missingQty) out.incomplete.push('quantities');
  return out;
}
function extractStepTime(t){
  const m=String(t).match(/(\d+)\s*(?:–|-|to)?\s*(\d+)?\s*(min|minute|hour|hr)s?\b/i);
  if(!m) return 0;
  const n=Number(m[2]||m[1]);
  return /h/i.test(m[3])?n*60:n;
}
function detectPlatform(url){
  const u=String(url||'').toLowerCase();
  if(u.includes('instagram.'))return 'Instagram';
  if(u.includes('tiktok.'))return 'TikTok';
  if(u.includes('youtube.')||u.includes('youtu.be'))return 'YouTube';
  if(u.includes('pinterest.'))return 'Pinterest';
  if(/^https?:\/\//.test(u)){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return 'Website'; } }
  return '';
}

      <span class="wordmark">${BRANDS[S.brand].mark}</span>
    </div>
    <div class="grow pad" style="display:flex;flex-direction:column;justify-content:center;padding-top:26px;padding-bottom:12px">
      <h1 class="d1" style="max-width:11ch">A cookbook with nothing in it.</h1>
      <p class="body" style="margin:20px 0 0;max-width:32ch">Yet. ${BRANDS[S.brand].mark} doesn’t come with recipes — it comes with room for yours.</p>
      <div class="figure" style="margin:36px 0 30px">${FIG.shelf}</div>
      <div class="ix" style="border-top-color:var(--rule)">
        ${[['Keep','Everything you cook, in one place — not scattered across screenshots and open tabs.'],
           ['Capture','Type it, paste it, photograph it, or pull it in from a link. It stays yours.'],
           ['Cook','Notes, timers and scaled quantities, on a screen that stays awake.']]
          .map(([t,d],i)=>`<div class="ix-row" style="align-items:flex-start">
            <span class="ix-n">${String(i+1).padStart(2,'0')}</span>
            <span class="ix-b"><span class="ix-t">${t}</span><span class="ix-s" style="white-space:normal;color:var(--ink-60);margin-top:3px">${d}</span></span>
          </div>`).join('')}
      </div>
    </div>
    <div class="pad" style="padding-bottom:26px;display:flex;flex-direction:column;gap:14px">
      <button class="btn" data-go="onboard" data-p='{"i":0}'>Set up my cookbook</button>
      <button class="tbtn mutlink" data-skip-onboard style="align-self:center;border-bottom:0;text-decoration:underline;text-underline-offset:3px">Skip — take me straight in</button>
    </div>
  </div>`;

/* ================================================== 3. ONBOARDING ======== */
const ONB=[
  {k:'name',   type:'text',  q:'What should we call your cookbook?',
   help:'This is the only name that appears on your library. You can change it later.',
   ph:'e.g. Mel’s kitchen', optional:true},
  {k:'capture',type:'multi', q:'Where do your recipes usually come from?',
   help:'We’ll put the right capture tools first. Choose as many as you like.',
   opts:['Websites','Instagram','TikTok','YouTube','Cookbooks','Handwritten cards','My own head','Screenshots']},
  {k:'diets',  type:'multi', q:'Anything you cook around?',
   help:'Used to label and filter your own recipes. Never to suggest new ones.', opts:DIETS},
  {k:'allergies',type:'tags',q:'Anything that must never be in the house?',
   help:'We’ll flag these when a recipe you save contains them.', ph:'Type an allergen and press enter'},
  {k:'dislikes',type:'tags',q:'And anything you’d simply rather not eat?',
   help:'Purely for filtering. Add as many or as few as you like.', ph:'e.g. coriander', optional:true},
  {k:'units',  type:'one',   q:'Metric or imperial?',
   help:'You can flip any single ingredient later.', opts:[['metric','Metric','grams, millilitres, °C'],['imperial','Imperial','ounces, cups, °F']]},
  {k:'household',type:'stepper',q:'How many people do you usually cook for?',
   help:'Sets the default when you scale a recipe.'},
  {k:'skill',  type:'one',   q:'How would you describe your cooking?',
   help:'Only used to set how much detail cooking mode shows by default.',
   opts:[['new','Still learning','Show me every step in full'],['confident','Confident','A steady middle'],['fast','Fast and loose','Keep it terse']]},
];
SCREENS.onboard = ({i=0}) => {
  const step=ONB[i]; const n=ONB.length; const pct=((i)/n)*100;
  const val=S.prefs[step.k];
  let field='';
  if(step.type==='text'){
    field=`<div class="field ${val?'focus':''}" style="border-bottom-color:var(--ink)">
      <input class="serifin" data-onb="${step.k}" value="${esc(val||'')}" placeholder="${esc(step.ph)}" data-autofocus aria-label="${esc(step.q)}"></div>`;
  }
  if(step.type==='multi'){
    field=`<div class="chiprow" role="group" aria-label="${esc(step.q)}">${step.opts.map(o=>
      `<button class="chip acc" data-onb-multi="${step.k}" data-v="${esc(o)}" aria-pressed="${(val||[]).includes(o)}">${esc(o)}</button>`).join('')}</div>`;
  }
  if(step.type==='one'){
    field=`<div class="ix" role="radiogroup" aria-label="${esc(step.q)}">${step.opts.map(([v,t,d])=>
      `<button class="ix-row" data-onb-one="${step.k}" data-v="${v}" role="radio" aria-checked="${val===v}">
        <span class="ix-b"><span class="ix-t">${esc(t)}</span><span class="ix-s">${esc(d)}</span></span>
        <span class="ix-r">${val===v?`<span class="check on">${ic('check',13,2)}</span>`:'<span class="check"></span>'}</span>
      </button>`).join('')}</div>`;
  }
  if(step.type==='tags'){
    field=`<div class="field focus" style="border-bottom-color:var(--ink)">
        <input data-onb-tag="${step.k}" placeholder="${esc(step.ph)}" data-autofocus aria-label="${esc(step.q)}">
      </div>
      <div class="chiprow" style="margin-top:16px">${(val||[]).map(t=>
        `<button class="chip on" data-onb-untag="${step.k}" data-v="${esc(t)}" aria-label="Remove ${esc(t)}">${esc(t)} ${ic('close',12,1.8)}</button>`).join('')}</div>`;
  }
  if(step.type==='stepper'){
    field=`<div style="display:flex;align-items:center;gap:26px;padding:8px 0">
      <button class="iconbtn" data-onb-step="-1" aria-label="Fewer" style="box-shadow:inset 0 0 0 1px var(--rule)">${ic('minus',18)}</button>
      <span class="d1 num" aria-live="polite" style="min-width:2ch;text-align:center">${S.prefs.household}</span>
      <button class="iconbtn" data-onb-step="1" aria-label="More" style="box-shadow:inset 0 0 0 1px var(--rule)">${ic('plus',18)}</button>
      <span class="sm">${plural(S.prefs.household,'person','people')}</span>
    </div>`;
  }
  const canNext = step.optional || (Array.isArray(val)?true:(val!==''&&val!=null));
  return `<div class="screen">
    <div style="height:2px;background:var(--rule-soft)"><div style="height:2px;width:${pct}%;background:var(--ink);transition:width .4s var(--ease)"></div></div>
    <header class="topbar" style="background:transparent">
      ${i>0?`<button class="iconbtn" data-onb-back="${i}" aria-label="Back">${ic('back',20)}</button>`:'<span style="width:40px"></span>'}
      <span class="micro" style="flex:1;text-align:center;opacity:1">${String(i+1).padStart(2,'0')} / ${String(n).padStart(2,'0')}</span>
      <button class="micro" data-skip-onboard style="min-height:44px;padding:0 6px">Skip</button>
    </header>
    <div class="grow pad" style="display:flex;flex-direction:column;padding-top:24px">
      <h1 class="d2" style="max-width:15ch">${esc(step.q)}</h1>
      <p class="sm" style="margin:12px 0 32px;max-width:34ch">${esc(step.help)}</p>
      ${field}
    </div>
    <div class="pad" style="padding-bottom:26px">
      <button class="btn" data-onb-next="${i}" ${canNext?'':'disabled'}>${i===n-1?'Done':'Continue'}</button>
    </div>
  </div>`;
};

/* ============================================== 4/5. AUTH =============== */
SCREENS.signin = () => {
  /* One screen, one button, both situations. Whether this becomes "attach to the
     account already holding my recipes" or "sign in to the account that has
     them" is decided by the server, not by asking her to self-diagnose — see
     saveAccess(). Guessing from local state would get it wrong on an empty
     device, which is exactly when she is most likely to be here. */
  const anon = !(S.auth && S.auth.email);
  return `<div class="screen">
  ${topbar({title:'Other devices'})}
  <div class="grow pad" style="padding-top:18px">
    <h1 class="d2" style="max-width:15ch">Open this on your laptop too.</h1>
    <p class="sm" style="margin:12px 0 26px;max-width:34ch">Your cookbook is already saved and backed up — you don’t need to do anything for that. This is only so a second device can open the same library, and so it comes back if this phone doesn’t.</p>

    <div class="field focus" style="border-bottom-color:var(--ink)">
      <label class="micro">Email</label>
      <input type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false"
             data-auth="email" placeholder="you@example.com" data-autofocus aria-label="Your email address">
    </div>
    ${anon?`<div class="field focus" style="border-bottom-color:var(--ink);margin-top:18px">
      <label class="micro">Email again</label>
      <input type="email" inputmode="email" autocomplete="off" autocapitalize="off" spellcheck="false"
             data-auth="email2" placeholder="you@example.com" aria-label="Your email address again">
    </div>`:''}
    <div class="field focus" style="border-bottom-color:var(--ink);margin-top:18px">
      <label class="micro">Password</label>
      <input type="password" autocomplete="${anon?'new-password':'current-password'}" autocapitalize="off" spellcheck="false"
             data-auth="pw" placeholder="At least 8 characters" aria-label="Password">
    </div>
    <button class="tbtn mutlink" data-reveal style="margin-top:10px;border-bottom:0;text-decoration:underline;text-underline-offset:3px">Show password</button>

    <div style="margin-top:26px">
      <button class="btn" data-signin>${anon?'Save access':'Sign in'}</button>
      ${anon?`<p class="xs" style="margin-top:12px;max-width:36ch">Let your phone’s password manager generate and remember it. <strong style="color:var(--ink)">There is no reset email yet</strong> — if this password is lost, the copy in your account can’t be reached, so save it somewhere before you continue.</p>`
            :`<p class="xs" style="margin-top:12px;max-width:36ch">The same library will open here.</p>`}
    </div>
  </div>
  <div class="pad" style="padding-bottom:26px;text-align:center">
    <button class="sm linky" data-guest>Not now</button>
  </div>
</div>`;
};

SCREENS.signup = () => SCREENS.signin();

/* ============================================ 6/7. LIBRARY ============== */
function recipeTile(r,opts={}){
  const t=totalTime(r);
  return `<button class="r-tile" data-recipe="${r.id}">
    ${media(r)}
    <h3>${esc(r.title||'Untitled')}</h3>
    <p class="meta">${[t?mins(t):'', r.serves?('Serves '+r.serves):'', opts.showCooked&&r.lastCooked?('Cooked '+relDate(r.lastCooked)):'']
      .filter(Boolean).join('<span class="dot"></span>')||'&nbsp;'}</p>
  </button>`;
}
function recipeRow(r,right){
  const t=totalTime(r);
  return `<button class="ix-row" data-recipe="${r.id}">
    <span class="ix-ic" style="width:46px">${media(r,'')}</span>
    <span class="ix-b"><span class="ix-t">${esc(r.title||'Untitled')}</span>
      <span class="ix-s">${[t?mins(t):'',r.serves?('Serves '+r.serves):'',r.cookCount?('Cooked '+r.cookCount+'×'):'Not cooked yet'].filter(Boolean).join(' · ')}</span></span>
    <span class="ix-r">${right||''}${ic('chev',15,1.5)}</span>
  </button>`;
}
const rowMediaFix = '';

function featureRecipe(r){
  const t=totalTime(r);
  const eyebrow=[r.cuisine,...r.mealTypes,...r.diets].filter(Boolean).slice(0,2).join(' · ')
    || (r.cookCount?('Cooked '+r.cookCount+' '+plural(r.cookCount,'time')):'Added '+relDate(r.added).toLowerCase());
  return `<button data-recipe="${r.id}" style="display:block;width:100%;text-align:left">
    ${media(r,'feat')}
    <div style="padding-top:14px">
      <p class="micro">${esc(eyebrow)}</p>
      <h2 class="d2" style="margin-top:9px">${esc(r.title||'Untitled')}</h2>
      ${r.description?`<p class="serif-it" style="font-size:14.5px;line-height:1.5;color:var(--ink-60);margin:9px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(r.description)}</p>`:''}
      <p class="meta" style="margin-top:9px">${[t?mins(t):'',r.serves?('Serves '+r.serves):'',r.difficulty].filter(Boolean).join('<span class="dot"></span>')}</p>
    </div>
  </button>`;
}
function collectionCard(c,w=150){
  const acc=(ACCENTS.find(a=>a.k===c.accent)||{}).v||'#D9D4CA';
  const n=c.recipes.length;
  return `<button data-collection="${c.id}" style="display:block;text-align:left;width:${w}px;flex:0 0 auto">
    <div class="ph" style="aspect-ratio:3/4;position:relative;background:var(--cream)">
      ${c.cover?`<img src="${imgSrc(c.cover)}" alt="">`:`
        ${coverArt(c.id+c.name,acc)}
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:14px;z-index:2">
          <span class="micro" style="color:${acc}">${String(n).padStart(2,'0')}</span>
          <span style="font-family:var(--display);font-size:16px;font-weight:500;line-height:1.2;letter-spacing:-.028em;color:var(--ink)">${esc(c.name)}</span>
        </div>`}
    </div>
    ${c.cover?`<p class="d5" style="margin-top:10px">${esc(c.name)}</p>`:''}
    <p class="meta" style="margin-top:${c.cover?'4px':'10px'}">${n} ${plural(n,'recipe')}${c.shared?'<span class="dot"></span>Shared':''}</p>
  </button>`;
}

SCREENS.library = () => {
  const all=liveRecipes();
  const head=`<header class="topbar" style="padding-top:2px">
      <span class="wordmark" style="flex:1;font-size:16px">${BRANDS[S.brand].mark}</span>
      <span class="tb-act">
        ${!S.online?`<span class="badge" style="margin-right:4px">${ic('offline',13,1.5)} Offline</span>`:''}
        <button class="iconbtn" data-go="collections" aria-label="Collections">${ic('book',20)}</button>
        <button class="iconbtn" data-go="shopping" aria-label="Shopping list">${ic('cart',20)}</button>
      </span>
    </header>`;

  if(!all.length){
    const drafts=S.drafts.length, imps=S.imports.length;
    return `<div class="screen">${head}
      ${(drafts||imps)?`<div class="pad" style="padding-bottom:18px">${ixList([
        drafts?{title:'Drafts',sub:drafts+' '+plural(drafts,'recipe')+' you started',icon:'note',attrs:'data-go="drafts"',n:false}:null,
        imps?{title:'Imports to review',sub:imps+' waiting for your check',icon:'link',attrs:'data-go="importq"',n:false}:null,
      ].filter(Boolean))}</div>`:''}
      <div class="grow" style="display:flex;flex-direction:column;padding-top:12px">
        ${emptyState({
          eyebrow:S.prefs.name?esc(S.prefs.name):'Your library',
          title:'Your recipes will live here.',
          sub:'Start with the meal you make most. One recipe is enough for this to be useful — the rest will follow.',
          figure:FIG.shelf,
          actions:ixList([
            {title:'Create a recipe',sub:'Type it out the way you cook it',icon:'edit',attrs:'data-new-recipe'},
            {title:'Import from a link',sub:'A website, Instagram, TikTok or YouTube',icon:'link',attrs:'data-import="url"'},
            {title:'Paste recipe text',sub:'From a note, an email or a message',icon:'text',attrs:'data-import="paste"'},
            {title:'Scan a cookbook page',sub:'Photograph it and tidy it up',icon:'scan',attrs:'data-import="scan"'},
            {title:'Upload a screenshot',sub:'The ones sitting in your camera roll',icon:'image',attrs:'data-import="shot"'},
            {title:'Create a collection',sub:'Set up the shelves before the books',icon:'book',attrs:'data-new-collection'},
          ])
        })}
      </div>
      <div class="tab-space"></div></div>`;
  }

  /* populated */
  const recent=[...all].sort((a,b)=>(b.added||'').localeCompare(a.added||'')||0);
  const feature=recent[0];
  const rest=recent.slice(1,7);
  const planned=plannedRecipeIds().map(getRecipe).filter(Boolean).filter(r=>!r.archived);
  const uncooked=all.filter(r=>!r.cookCount).slice(0,6);
  const cooked=[...all].filter(r=>r.lastCooked).sort((a,b)=>(b.lastCooked||'').localeCompare(a.lastCooked||'')).slice(0,6);
  const favs=all.filter(r=>r.favourite);
  const withNotes=all.filter(r=>(r.notes||'').trim());
  const frequent=[...all].filter(r=>(r.cookCount||0)>1).sort((a,b)=>b.cookCount-a.cookCount).slice(0,6);
  const s=x=>x&&x.length;

  return `<div class="screen">${head}
    <div class="pad" style="padding-top:4px">
      <p class="micro">${S.prefs.name?esc(S.prefs.name):'Your library'}</p>
      <h1 class="d1" style="margin-top:8px">${all.length} ${plural(all.length,'recipe')}<span class="mut">.</span></h1>
    </div>

    ${(S.drafts.length||S.imports.length)?`<div class="pad" style="padding-top:26px">${ixList([
      S.imports.length?{title:'Imports awaiting review',sub:S.imports.length+' need your check before saving',icon:'link',attrs:'data-go="importq"',n:false}:null,
      S.drafts.length?{title:'Drafts',sub:S.drafts.length+' started, not finished',icon:'note',attrs:'data-go="drafts"',n:false}:null,
    ].filter(Boolean))}</div>`:''}

    <section class="sect pad">
      <div class="sect-head"><p class="micro">Most recently added</p></div>
      ${featureRecipe(feature)}
    </section>

    ${rest.length?`<section class="sect pad">
      <div class="sect-head"><p class="micro">Also new</p>
        <button class="micro ink" data-go="search" style="min-height:40px">See all ${ic('chev',11,2)}</button></div>
      <div class="tilegrid">${rest.map(r=>recipeTile(r)).join('')}</div>
    </section>`:''}

    ${s(planned)?`<section class="sect">
      <div class="sect-head pad"><p class="micro">Planned this week</p>
        <button class="micro ink" data-go="planner" style="min-height:40px">Planner ${ic('chev',11,2)}</button></div>
      <div style="display:flex;gap:14px;overflow-x:auto;padding:0 var(--pad) 4px;scrollbar-width:none">
        ${planned.slice(0,8).map(r=>`<div style="width:132px;flex:0 0 auto">${recipeTile(r)}</div>`).join('')}
      </div></section>`:''}

    ${s(S.collections)?`<section class="sect">
      <div class="sect-head pad"><p class="micro">Collections</p>
        <button class="micro ink" data-go="collections" style="min-height:40px">All ${ic('chev',11,2)}</button></div>
      <div style="display:flex;gap:14px;overflow-x:auto;padding:0 var(--pad) 4px;scrollbar-width:none">
        ${S.collections.slice(0,6).map(c=>collectionCard(c,142)).join('')}
        <button data-new-collection style="width:142px;flex:0 0 auto;text-align:left">
          <div style="aspect-ratio:3/4;box-shadow:inset 0 0 0 1px var(--rule);display:flex;align-items:center;justify-content:center;color:var(--ink-30)">${ic('plus',22)}</div>

      ${rowMediaFix}<div class="ix">${uncooked.map(r=>recipeRow(r)).join('')}</div>
    </section>`:''}

    ${s(frequent)?`<section class="sect pad">
      <div class="sect-head"><p class="micro">You come back to these</p></div>
      <div class="tilegrid">${frequent.slice(0,4).map(r=>recipeTile(r,{showCooked:true})).join('')}</div>
    </section>`:''}

    ${s(cooked)?`<section class="sect pad">
      <div class="sect-head"><p class="micro">Recently cooked</p>
        <button class="micro ink" data-go="history" style="min-height:40px">History ${ic('chev',11,2)}</button></div>
      <div class="ix">${cooked.slice(0,4).map(r=>recipeRow(r,`<span class="xs">${relDate(r.lastCooked)}</span>`)).join('')}</div>
    </section>`:''}

    ${s(favs)?`<section class="sect pad">
      <div class="sect-head"><p class="micro">Favourites</p></div>
      <div class="tilegrid">${favs.slice(0,4).map(r=>recipeTile(r)).join('')}</div>
    </section>`:''}

    ${s(withNotes)?`<section class="sect pad">
      <div class="sect-head"><p class="micro">With your notes</p></div>
      <div class="ix">${withNotes.slice(0,3).map(r=>recipeRow(r,`<span class="ix-ic" style="width:auto">${ic('note',15)}</span>`)).join('')}</div>

    ${all.length<4?`<section class="sect pad">

    </section>`:''}
    <div class="tab-space"></div>
  </div>`;
};
