    body:'Your recipes, images, notes and history are permanently removed. Export first if you want to keep them.',confirm:'Delete everything',danger:true,
    onConfirm:()=>{ S.recipes=[];S.drafts=[];S.imports=[];S.collections=[];S.planner={};S.list=[];S.pantry=[];S.history=[];S.household=[];S.shares=[];
      S.auth=null;S.onboarded=false; reset('intro'); toast('Everything deleted.'); }}); return; }

  /* ---- nutrition ---- */
  if(d.nutrition!==undefined){ stop(); closeAllLayers(); go('nutrition',{id:d.nutrition}); return; }
  if(d.energyUnit!==undefined){ stop(); S.prefs.energyUnit=S.prefs.energyUnit==='kj'?'kcal':'kj'; render(true); return; }
  if(d.spoons!==undefined){ stop(); S.prefs.spoons=d.spoons; render(true);
    toast('Spoon sizes set to '+SPOON_SYSTEMS[d.spoons].label+'.'); return; }
  if(d.healthTarget!==undefined){ stop(); S.prefs.health.target=d.healthTarget; render(true); return; }
  if(d.healthAuto!==undefined){ stop(); S.prefs.health.auto=!S.prefs.health.auto; render(true); return; }
  if(d.setServes!==undefined){ stop(); const r=getRecipe(d.setServes);
    sheetPrompt({title:'How many does it serve?',label:'Servings',value:r.serves,ph:String(S.prefs.household),
      cb:v=>{ r.serves=v.trim(); render(true); }}); return; }
  if(d.matchIng!==undefined){ stop(); const [rid,iid]=d.matchIng.split(':');
    S.ui.match={q:'',results:null,busy:false,err:'',found:null};
    openSheet(sheetMatch(rid,iid),{label:'Match ingredient'}); return; }
  if(d.nutSearch!==undefined){ stop(); const [rid,iid]=d.nutSearch.split(':');
    const input=$('[data-nut-q]'); const q=(input?input.value:'').trim();
    if(!q){ toast('Type what to search for.'); return; }
    S.ui.match={...S.ui.match,q,busy:true,err:'',results:null};
    refreshMatchSheet(rid,iid);
    fdcSearch(q).then(res=>{
      S.ui.match={...S.ui.match,busy:false,results:res,found:res};
      refreshMatchSheet(rid,iid);
    }).catch(err=>{
      const msg = err.message==='key' ? 'That API key was rejected. Check it in Nutrition settings, or clear it to use USDA’s shared DEMO_KEY.'
        : err.message==='rate' ? 'USDA’s shared DEMO_KEY is rate-limited (about 30 lookups an hour). A free key of your own removes that.'
        : 'Couldn’t reach USDA FoodData Central. You may be offline, or the browser blocked the request.';
      S.ui.match={...S.ui.match,busy:false,err:msg,results:null};
      refreshMatchSheet(rid,iid);
    });
    return; }
  if(d.pickFood!==undefined){ stop(); const [rid,iid,k]=d.pickFood.split(':');
    const food=(S.ui.match.results||[])[Number(k)]; if(!food) return;
    const r=getRecipe(rid); const ing=allIngredients(r).find(x=>x.id===iid);
    ing.nut={fdcId:food.fdcId,desc:food.desc,per100:food.per100,portions:[],gramsPerUnit:null,gramSource:''};
    rememberFood(ing.name,ing.nut);
    refreshMatchSheet(rid,iid);
    fdcDetail(food.fdcId).then(det=>{
      ing.nut.portions=det.portions; if(det.per100&&det.per100.kcal!=null) ing.nut.per100=det.per100;
      rememberFood(ing.name,ing.nut);
      if(!ingredientGrams(ing)) askGrams(rid,iid); else refreshMatchSheet(rid,iid);
    }).catch(()=>{ if(!ingredientGrams(ing)) askGrams(rid,iid); else refreshMatchSheet(rid,iid); });
    return; }
  if(d.useRecalled!==undefined){ stop(); const [rid,iid]=d.useRecalled.split(':');
    const r=getRecipe(rid); const ing=allIngredients(r).find(x=>x.id===iid);
    ing.nut=recallFood(ing.name);
    if(!ingredientGrams(ing)) askGrams(rid,iid); else { refreshMatchSheet(rid,iid); toast('Matched.'); }
    return; }
  if(d.setGrams!==undefined){ stop(); const [rid,iid]=d.setGrams.split(':'); askGrams(rid,iid); return; }
  if(d.unmatch!==undefined){ stop(); const [rid,iid]=d.unmatch.split(':');
    const ing=allIngredients(getRecipe(rid)).find(x=>x.id===iid); ing.nut=null;
    refreshMatchSheet(rid,iid); return; }
  if(d.skipIng!==undefined){ stop(); closeLayer(); render(true);
    toast('Left out. The total will report itself as incomplete.'); return; }
  if(d.manualPer100!==undefined){ stop(); const [rid,iid]=d.manualPer100.split(':');
    const ing=allIngredients(getRecipe(rid)).find(x=>x.id===iid);
    closeLayer();
    setTimeout(()=>sheetPrompt({title:'Per 100 g, from the packet',
      label:'kcal, protein g, carbs g, fat g — comma separated',ph:'884, 0, 0, 100',
      value: ing.nut&&ing.nut.per100 ? [ing.nut.per100.kcal,ing.nut.per100.protein,ing.nut.per100.carbs,ing.nut.per100.fat].join(', ') : '',
      cb:v=>{
        const p=v.split(',').map(x=>Number(String(x).trim()));
        if(!p.length||isNaN(p[0])){ toast('Enter at least the calories.'); return; }
        ing.nut={fdcId:null,desc:'Your own figures, from the packet',
          per100:{kcal:p[0],protein:isNaN(p[1])?null:p[1],carbs:isNaN(p[2])?null:p[2],fat:isNaN(p[3])?null:p[3]},
          portions:[],gramsPerUnit:(ing.nut&&ing.nut.gramsPerUnit)||null,gramSource:(ing.nut&&ing.nut.gramSource)||''};
        rememberFood(ing.name,ing.nut);
        if(!ingredientGrams(ing)) askGrams(rid,iid); else { render(true); toast('Saved.'); }
      }}),160);
    return; }
  if(d.nutManual!==undefined){ stop(); const r=getRecipe(d.nutManual);
    r.nutritionMode = r.nutritionMode==='manual'?'computed':'manual';
    if(r.nutritionMode==='manual'){ startEdit(r.id); S.ui.editSection=5; render();
      toast('Type the label values here. They override the computed ones.'); }
    else render(true);
    return; }
  if(d.nutClear!==undefined){ stop(); const r=getRecipe(d.nutClear);
    confirmDialog({title:'Clear every match?',body:'The ingredients stay; only the food matches and weights are removed.',
      confirm:'Clear',danger:true,onConfirm:()=>{ allIngredients(r).forEach(i=>i.nut=null); render(true); toast('Cleared.'); }});
    return; }

  /* ---- health ---- */
  if(d.healthLog!==undefined){ stop(); const r=getRecipe(d.healthLog);
    const n=computeNutrition(r);
    if(!n.complete){ toast('Every ingredient has to be accounted for first.'); return; }
    S.ui.healthServ=1; closeAllLayers();
    setTimeout(()=>openSheet(sheetHealth(r.id,1),{label:'Send to Health'}),140); return; }
  if(d.healthServ!==undefined){ stop();
    S.ui.healthServ=clamp((S.ui.healthServ||1)+(num(d.healthServ)*0.5),0.5,12);
    const id=$('[data-health-write]').dataset.healthWrite.split(':')[0];
    const sh=$('.sheet'); if(sh) sh.innerHTML='<div class="grab"></div>'+sheetHealth(id,S.ui.healthServ); return; }
  if(d.healthWrite!==undefined){ stop(); const [rid,s]=d.healthWrite.split(':');
    const r=getRecipe(rid); const n=computeNutrition(r); const serv=Number(s);
    S.healthLog.unshift({id:uid('hl'),recipeId:rid,title:r.title,date:todayISO(),servings:serv,
      kcal:n.perServe.kcal*serv, protein:n.perServe.protein*serv, carbs:n.perServe.carbs*serv, fat:n.perServe.fat*serv,
      target:S.prefs.health.target});
    closeAllLayers(); render(true);
    toast(`${Math.round(n.perServe.kcal*serv)} kcal written. Strong will pick it up from ${S.prefs.health.target==='apple'?'Apple Health':'Health Connect'}.`);
    return; }
  if(d.healthCopy!==undefined){ stop(); const [rid,s]=d.healthCopy.split(':');
    const r=getRecipe(rid); const n=computeNutrition(r); const serv=Number(s);
    copyText(JSON.stringify({name:r.title,servings:serv,
      energy_kcal:round1(n.perServe.kcal*serv), protein_g:round1(n.perServe.protein*serv),
      carbohydrate_g:round1(n.perServe.carbs*serv), fat_g:round1(n.perServe.fat*serv),
      fibre_g:round1(n.perServe.fibre*serv), recorded_at:new Date().toISOString()},null,2),'Payload copied.');
    return; }
  if(d.healthCsv!==undefined){ stop(); const [rid,s]=d.healthCsv.split(':');
    const r=getRecipe(rid); const n=computeNutrition(r); const serv=Number(s);
    download('health-'+todayISO()+'.csv',
      'date,meal,servings,energy_kcal,protein_g,carbohydrate_g,fat_g,fibre_g\n'+
      [todayISO(),'"'+String(r.title).replace(/"/g,'""')+'"',serv,
       round1(n.perServe.kcal*serv),round1(n.perServe.protein*serv),round1(n.perServe.carbs*serv),
       round1(n.perServe.fat*serv),round1(n.perServe.fibre*serv)].join(','),'text/csv');
    toast('CSV downloaded.'); return; }

  /* ---- export / share actions ---- */
  if(d.export!==undefined){ stop(); doExport(d.export); return; }
  if(d.doShare!==undefined){ stop(); const [kind,id]=d.doShare.split(':'); doShare(kind,getRecipe(id)); return; }
}

/* ---- match sheet helpers ---- */
function refreshMatchSheet(rid,iid){
  const sh=$('.sheet'); if(!sh) return;
  sh.innerHTML='<div class="grab"></div>'+sheetMatch(rid,iid);
  const inp=sh.querySelector('[data-nut-q]'); if(inp&&S.ui.match.q) inp.value=S.ui.match.q;
}
function askGrams(rid,iid){
  const r=getRecipe(rid); const ing=allIngredients(r).find(x=>x.id===iid);
  const qty=[ing.qty,ing.unit].filter(Boolean).join(' ')||'this amount';
  const ml=volToMl(ing.unit); const n=parseQty(ing.qty);
  const portions=(ing.nut&&ing.nut.portions)||[];
  closeAllLayers();
  setTimeout(()=>{
    const w=openSheet(`<div class="sheet-h"><h2 class="d4">How much does that weigh?</h2>
      <button class="iconbtn" data-dismiss aria-label="Close">${ic('close',18)}</button></div>
    <div class="sheet-b">
      <p class="sm" style="margin:6px 0 16px;max-width:34ch">We know the nutrition of <strong style="color:var(--ink)">${esc(ing.nut?ing.nut.desc:ing.name)}</strong> per 100 g. To use it we need the weight of <strong style="color:var(--ink)">${esc(qty)}</strong>. We won't guess it.</p>
      ${ml&&n?`<p class="xs" style="margin-bottom:14px">That's ${Math.round(ml*n)} ml at ${SPOON_SYSTEMS[S.prefs.spoons].label} spoon sizes. Weight depends on the food, so it still needs a number.</p>`:''}
      ${portions.length?`<p class="micro" style="margin-bottom:8px">USDA publishes these portions for it</p>
        <div class="ix" style="margin-bottom:20px">${portions.slice(0,8).map((p,k)=>`
          <button class="ix-row" data-use-portion="${rid}:${iid}:${k}">
            <span class="ix-b"><span class="ix-t" style="font-weight:400">${esc(p.label)}</span>
            <span class="ix-s">${p.grams} g</span></span><span class="ix-r">${ic('chev',15,1.5)}</span></button>`).join('')}</div>`:''}
      <div class="field focus" style="border-bottom-color:var(--ink)">
        <label class="micro">Grams for ${esc(qty)}</label>
        <input data-grams inputmode="decimal" placeholder="e.g. 30" data-autofocus aria-label="Grams">
      </div>
      <div style="margin-top:20px"><button class="btn" data-save-grams="${rid}:${iid}">Save</button></div>
      <p class="xs" style="margin-top:14px;max-width:36ch">Entered once and remembered for this ingredient everywhere in your library.</p>
    </div>`,{label:'Set the weight'});
    w.querySelector('[data-save-grams]').addEventListener('click',()=>{
      const v=Number(w.querySelector('[data-grams]').value);
      if(!v||v<=0){ toast('Enter a number of grams.'); return; }
      const per=v/(parseQty(ing.qty)||1);
      ing.nut=ing.nut||{fdcId:null,desc:'Your own figures',per100:{},portions:[]};
      ing.nut.gramsPerUnit=per; ing.nut.gramSource='you weighed it: '+qty+' = '+v+' g';
      rememberFood(ing.name,ing.nut);
      closeLayer(); render(true); toast('Saved and remembered.');
    });
  },160);
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-use-portion]'); if(!el) return; e.preventDefault(); e.stopPropagation();
  const [rid,iid,k]=el.dataset.usePortion.split(':');

});

/* ------------------------------------------------------- import runner */
function doUrlImport(url){
  const plat=detectPlatform(url);
  go('loading',{label:'Reading '+(plat||'the page')});
  const finish=(payload,note)=>{
    const r=newRecipe(Object.assign({url,platform:plat,source:plat},payload));
    r.incomplete=payload.incomplete||['title','ingredients','steps','serves','time'];
    S.imports.push(r);
    replace('review',{id:r.id});
    if(note) setTimeout(()=>toast(note),400);
  };
  const ctrl=new AbortController();
  const to=setTimeout(()=>ctrl.abort(),3500);
  fetch(url,{signal:ctrl.signal,mode:'cors'})
    .then(res=>res.text())
    .then(html=>{
      clearTimeout(to);
      const t=(html.match(/<title[^>]*>([^<]+)</i)||[])[1]||'';
      const ld=html.match(/<script[^>]+application\/ld\+json[^>]*>([\s\S]*?)<\/script>/i);
      let payload={title:t.split(/[|–—-]/)[0].trim(),incomplete:['ingredients','steps','serves','time']};
      if(ld){ try{
        const data=JSON.parse(ld[1]);
        const node=(Array.isArray(data)?data:[data,...(data['@graph']||[])]).find(x=>x&&/Recipe/i.test(String(x['@type'])));
        if(node){
          const items=(node.recipeIngredient||[]).join('\n');
          const steps=(Array.isArray(node.recipeInstructions)?node.recipeInstructions.map(s=>typeof s==='string'?s:s.text):[]).filter(Boolean);
          const p=parseRecipeText('Ingredients\n'+items);
          payload={ title:node.name||payload.title, author:(node.author&&(node.author.name||node.author))||'',
            groups:p.groups.length?p.groups:[{id:uid('g'),name:'',items:[]}],
            steps:steps.map(s=>({id:uid('s'),text:s,time:extractStepTime(s)})),
            serves:String(node.recipeYield||'').replace(/[^\d]/g,''), image:typeof node.image==='string'?node.image:'',
            incomplete:[] };
          ['title','ingredients','steps','serves'].forEach(k=>{
            const empty={title:!payload.title,ingredients:!p.groups.length,steps:!steps.length,serves:!payload.serves}[k];
            if(empty) payload.incomplete.push(k);
          });
        }
      }catch(err){} }
      finish(payload, payload.incomplete.length?`${payload.incomplete.length} ${plural(payload.incomplete.length,'field')} couldn’t be read. Nothing was guessed.`:'Read cleanly — check it over.');
    })
    .catch(()=>{
      clearTimeout(to);
      finish({title:'',author:'',source:plat,incomplete:['title','ingredients','steps','serves','time','quantities']},
        'Couldn’t reach that page from here. The link and platform are kept — fill in the rest, or paste the text.');
    });
}

/* --------------------------------------------------------- export/share */
function doExport(kind){
  const stamp=todayISO();
  if(kind==='json'){
    const payload={exported:stamp,app:BRANDS[S.brand].mark,version:1,
      preferences:S.prefs,recipes:S.recipes,collections:S.collections,planner:S.planner,
      shoppingList:S.list,pantry:S.pantry,cookingHistory:S.history};
    download(`${BRANDS[S.brand].mark.toLowerCase()}-library-${stamp}.json`,JSON.stringify(payload,null,2),'application/json');
    toast(S.recipes.length?'Your whole library, downloaded.':'Exported — an empty library is still yours.'); return;
  }
  if(kind==='txt'){
    if(!S.recipes.length){ toast('Nothing to export yet.'); return; }
    download(`${BRANDS[S.brand].mark.toLowerCase()}-recipes-${stamp}.txt`,S.recipes.map(recipeAsText).join('\n\n———\n\n'));
    toast('Downloaded as plain text.'); return;
  }
  if(kind==='list'){
    copyText(S.list.filter(i=>!i.excluded).map(i=>`- ${[i.qty,i.unit,i.name].filter(Boolean).join(' ')}`).join('\n'),'Shopping list copied.'); return;
  }
  if(kind==='print'){ printLibrary(); return; }
}

function doShare(kind,r){

    if(!S.household.length){ closeLayer(); setTimeout(()=>go('household'),160); return; }
    closeLayer(); toast(`Sent to ${S.household.length} ${plural(S.household.length,'person')}.`); return; }
  if(kind==='link'){ S.shares.push({id:uid('sh'),title:r.title,type:'Recipe',date:todayISO()});
    closeLayer(); toast('Read-only link created. Revoke it any time in Privacy.'); return; }
  if(kind==='text'){ copyText(recipeAsText(r),'Recipe copied.'); closeLayer(); return; }
  if(kind==='ings'){ copyText(allIngredients(r).map(i=>[i.qty,i.unit,i.name].filter(Boolean).join(' ')).join('\n'),'Ingredients copied.'); closeLayer(); return; }
  if(kind==='print'){ closeLayer(); printLibrary([r]); return; }
  if(kind==='pdf'){ closeLayer(); printLibrary([r]);
    setTimeout(()=>toast('Choose “Save as PDF” in the print dialog.'),900); return; }
}
function sheetCollect(recipeId){

  <div class="sheet-b">
    ${S.collections.length?`<div class="ix">${S.collections.map(c=>`
      <button class="ix-row" data-pick="addcoll:${recipeId}:${c.id}">
        <span class="ix-b"><span class="ix-t">${esc(c.name)}</span><span class="ix-s">${c.recipes.length} ${plural(c.recipes.length,'recipe')}</span></span>
        <span class="ix-r">${r.collections.includes(c.id)?`<span class="check on">${ic('check',12,2.2)}</span>`:'<span class="check"></span>'}</span></button>`).join('')}</div>`
    :`<p class="sm" style="margin:6px 0 18px">No collections yet.</p>`}

/* ==========================================================================
   SYNC — Supabase
   --------------------------------------------------------------------------
   The app works entirely on its own. Signing in adds three things and changes
   nothing else: your library survives a refresh, follows you between devices,
   and your photos live in storage rather than in the page.

   Everything here degrades to guest mode if Supabase is unreachable. Losing
   the network should never cost you the recipe you are halfway through typing.
   ========================================================================== */
const SUPABASE_URL = 'https://aoyupvfweygtpkvtoyay.supabase.co';
/* Publishable, and meant to be. It identifies the project, it does not grant
   access — row-level security decides what any given signed-in user can read
   or write, and the default is deny. */
const SUPABASE_KEY = 'sb_publishable_HFZEoZlE043933FXxBOnHQ_D9skPIwY';

let sb = null;
const IMG_URL = {};            // storage path -> signed URL, resolved at load

/* Only these keys are the user's library. `ui`, `route` and `stack` are
   session furniture and are deliberately never synced. */
const SYNC_KEYS = ['prefs','recipes','drafts','collections','imports','planner','list',
                   'pantry','history','household','shares','foodMemory','healthLog',
                   'brand','theme','onboarded'];

/* ==========================================================================
   LOCAL PERSISTENCE — the app must survive a refresh with no account at all.
   IndexedDB rather than localStorage: a photographed library is tens of
   megabytes and localStorage caps out around five. This runs unconditionally,
   before and regardless of any network, so closing the app is never a loss.
   ========================================================================== */
const LOCAL_DB='mise-local', LOCAL_STORE='state';
let localDbP=null;
function localDb(){
  if(localDbP) return localDbP;
  localDbP = new Promise((res,rej)=>{
    if(!('indexedDB' in window)) return rej(new Error('no indexeddb'));
    const rq=indexedDB.open(LOCAL_DB,1);
    rq.onupgradeneeded=()=>{ if(!rq.result.objectStoreNames.contains(LOCAL_STORE)) rq.result.createObjectStore(LOCAL_STORE); };
    rq.onsuccess=()=>res(rq.result);
    rq.onerror=()=>rej(rq.error);
  }).catch(e=>{ console.warn('[mise] no local database', e); return null; });
  return localDbP;
}
async function localSave(){
  const db=await localDb(); if(!db) return;
  const payload={}; SYNC_KEYS.forEach(k=>payload[k]=S[k]);
  /* Which account this device copy belongs to, so a later load can tell
     "my own data coming back" from "a different library". */
  payload.__account = (S.auth && S.auth.id) || null;
  try{
    await new Promise((res,rej)=>{
      const tx=db.transaction(LOCAL_STORE,'readwrite');
      tx.objectStore(LOCAL_STORE).put(payload,'state');
      tx.oncomplete=res; tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error);
    });
  }catch(e){ console.warn('[mise] local save failed', e); }
}
async function localLoad(){
  const db=await localDb(); if(!db) return null;
  try{
    return await new Promise((res,rej)=>{
      const tx=db.transaction(LOCAL_STORE,'readonly');
      const rq=tx.objectStore(LOCAL_STORE).get('state');
      rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error);
    });
  }catch(e){ return null; }
}
let localTimer=null, localReady=false;
/* Nothing may be written back until the restore has been attempted, or the
   first render of an empty app would overwrite a real library with nothing. */
function scheduleLocalSave(){ if(!localReady) return; clearTimeout(localTimer); localTimer=setTimeout(localSave, 400); }
/* A phone can be closed mid-keystroke. Flush on the way out. */
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') localSave(); });
window.addEventListener('pagehide', localSave);

function setSync(status, detail){
  const wasUnknown = !!(S.sync && S.sync.status==='unknown');
  S.sync = {status, detail: detail||'', at: Date.now()};
  const el = document.getElementById('syncdot');
  if(el) el.outerHTML = syncDot();
  /* Swapping the dot alone is enough everywhere except Profile, whose card copy
     also depends on settledness. Leaving that stale is the original bug in a
     second costume: sitting on Profile while sync resolves would keep showing
     'Checking your backup' under a green dot. */
  if(wasUnknown && S.route && S.route.name==='profile') render(true);
}
function syncDot(){
  const s = (S.sync&&S.sync.status)||'off';
  const map = {
    /* 'unknown' is the state at boot: the device copy is certainly saved, but
       whether the backup is on is not known yet. Saying 'Saved on this device'
       here reads as a settled verdict and is how the app came to tell Mel it
       wasn't backed up when it was. */
    unknown:['Checking your backup',  'var(--ink-45)'],
    off:    ['Saved on this device',  'var(--ink-45)'],
    loading:['Opening your library',  'var(--clay)'],
    saving: ['Saving',                'var(--clay)'],
    saved:  ['Saved',                 'var(--olive)'],
    error:  [(S.sync&&S.sync.detail)||'Saved here, not backed up', 'var(--clay-ink)'],
    offline:['Offline — saved on this device', 'var(--ink-45)'],
  };
  const [label,colour] = map[s]||map.off;
  return `<span id="syncdot" class="xs" style="display:inline-flex;align-items:center;gap:7px;color:var(--ink-45)">
    <span style="width:6px;height:6px;border-radius:50%;background:${colour};flex:0 0 auto"></span>${esc(label)}</span>`;
}

async function supabaseReady(){
  if(window.__supabaseSettled) return !!window.__createClient;
  await new Promise(r=>{
    if(window.__supabaseSettled) return r();
    window.addEventListener('supabase-settled', r, {once:true});
    setTimeout(r, 6000);                      // never hang the app on a slow CDN
  });
  return !!window.__createClient;
}

async function initSync(){
  const ok = await supabaseReady();
  if(!ok){ setSync('offline'); return null; }
  sb = window.__createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:'pkce' },
  });
  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='SIGNED_IN' && session){
      /* Fires for the silent anonymous claim too, and again for the session we
         just handled by hand. Neither deserves an announcement. */
      const known = S.auth && S.auth.id === session.user.id;
      onSignedIn(session, known || !!session.user.is_anonymous);
    }
    if(event==='USER_UPDATED' && session && session.user.email){
      S.auth = Object.assign({}, S.auth, {email: session.user.email, anon:false});
      render(true); toast('Email added. Your cookbook will follow you.');
    }
    if(event==='SIGNED_OUT'){ S.auth={mode:'guest'}; setSync('off'); }
  });
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ await onSignedIn(session, true); return sb; }

  /* No session, and no sign-in screen to send anyone to. Claim an anonymous
     one silently: a real user row with a real JWT, so row-level security still
     applies and the library is backed up — it just has no email on it yet and
     nothing to remember. An email can be attached later from Profile, which
     upgrades this same account rather than starting a second one.
     If anonymous sign-in is off, or the network is down, the app carries on
     against the device copy. That path is not an error, so it isn't reported
     as one. */
  try{
    const { data, error } = await sb.auth.signInAnonymously();
    if(error) throw error;
    if(data && data.session) await onSignedIn(data.session, true);
    else setSync('off');
  }catch(e){
    console.info('[mise] running on this device only —', e && e.message);
    S.auth = {mode:'guest'};
    setSync('off');
  }
  return sb;
}

let loadedFor = null;
async function onSignedIn(session, quiet){
  S.auth = {mode:'account', email: session.user.email||'', id: session.user.id,
            anon: !!session.user.is_anonymous};
  /* Strip the auth fragment so a refresh doesn't try to re-consume the link. */
  if(location.hash.includes('access_token')||location.search.includes('code=')){
    history.replaceState({}, '', location.pathname);
  }
  if(loadedFor === session.user.id){ setSync('saved'); return; }
  loadedFor = session.user.id;
  await loadRemote();
  if(!quiet) toast('This is your cookbook, on this device too.');
}

/* ---- read ---- */
async function loadRemote(){
  if(!sb || !S.auth || S.auth.mode!=='account') return;
  setSync('loading');
  try{
    const { data, error } = await sb.from('app_state').select('state,revision').maybeSingle();
    if(error) throw error;
    const localHasWork = S.recipes.length || S.drafts.length || S.collections.length;
    const sameAccount = S.localAccount && S.localAccount === S.auth.id;
    if(data && data.state && Object.keys(data.state).length){
      if(localHasWork && sameAccount){
        /* Our own copy coming back to us. Union both sides and say nothing —
           there is no decision here for anyone to make. */
        mergeState(data.state); render(); scheduleSave();
        await resolveImages(); setSync('saved'); render(true); return;
      }
      if(localHasWork){
        /* A different library, on a device that already has work of its own.
           Never silently discard either side — ask. */
        const remote = data.state;
        setSync('saved');
        confirmDialog({
          title:'You have recipes here and in your account',
          body:`This device has ${S.recipes.length} ${plural(S.recipes.length,'recipe')} that isn't in your account yet, and your account has ${(remote.recipes||[]).length}. Keep both?`,
          confirm:'Keep both',
          onConfirm:()=>{ mergeState(remote); render(); scheduleSave(); },
        });
        return;
      }
      applyState(data.state);
      render();
    } else {
      /* First sign-in: whatever is on this device becomes the account. */
      await saveRemote();
    }
    await resolveImages();
    setSync('saved');
    render(true);
  }catch(e){
    setSync('error', 'Could not load — working locally');
    console.warn('[mise] load failed', e);
  }
}

function applyState(st){
  SYNC_KEYS.forEach(k=>{ if(st[k]!==undefined) S[k]=st[k]; });
  /* Anything added to the model since this snapshot was written. */
  S.prefs = Object.assign({}, newPrefsDefaults(), S.prefs||{});
  S.foodMemory = S.foodMemory||{};
  S.healthLog = S.healthLog||[];
}
function newPrefsDefaults(){
  return {name:'',diets:[],allergies:[],dislikes:[],units:'metric',household:2,capture:[],skill:'',
    notifications:{tonight:true,expiry:false,prep:true,weekly:true,shared:true},
    privacy:{privateDefault:true,analytics:false,trainingOptOut:true},
    scaleHint:true, spoons:'au', fdcKey:'', energyUnit:'kcal',
    health:{connected:false,auto:false,target:'apple'}};
}
/* Union by id — nothing is dropped, nothing is duplicated. */
function mergeState(remote){
  const byId = (a,b)=>{ const seen=new Set(a.map(x=>x.id)); return a.concat((b||[]).filter(x=>!seen.has(x.id))); };
  ['recipes','drafts','collections','imports','history','pantry','list','household','shares']
    .forEach(k=>{ S[k] = byId(S[k]||[], remote[k]||[]); });
  Object.entries(remote.planner||{}).forEach(([day,entries])=>{
    const mine = S.planner[day]||[];
    const seen = new Set(mine.map(e=>e.id));
    S.planner[day] = mine.concat(entries.filter(e=>!seen.has(e.id)));
  });
  S.foodMemory = Object.assign({}, remote.foodMemory||{}, S.foodMemory||{});
  if(!S.prefs.name && remote.prefs && remote.prefs.name) S.prefs.name = remote.prefs.name;
}

/* ---- write ---- */
let saveTimer = null, saveInFlight = false, saveAgain = false;
function scheduleSave(){
  /* The device copy is the one that must never fail, so it is written first
     and unconditionally. The backup is best-effort on top of it. */
  scheduleLocalSave();
  if(!sb || !S.auth || S.auth.mode!=='account') return;
  clearTimeout(saveTimer);
  setSync('saving');
  saveTimer = setTimeout(saveRemote, 1200);
}
async function saveRemote(){
  if(!sb || !S.auth || S.auth.mode!=='account') return;
  if(saveInFlight){ saveAgain = true; return; }
  saveInFlight = true;
  try{
    const payload = {};
    SYNC_KEYS.forEach(k=>payload[k]=S[k]);
    const { error } = await sb.from('app_state')
      .upsert({ user_id: S.auth.id, state: payload }, { onConflict:'user_id' });
    if(error) throw error;
    setSync('saved');
  }catch(e){
    setSync('error','Not saved — will retry');
    console.warn('[mise] save failed', e);
    setTimeout(scheduleSave, 8000);
  }finally{
    saveInFlight = false;
    if(saveAgain){ saveAgain=false; scheduleSave(); }
  }
}

/* ---- images ----
   Photos go to private per-user storage, not into the state blob. A library of
   fifty photographed recipes would otherwise be tens of megabytes re-downloaded
   on every single load. State holds the path; URLs are signed at load time. */
async function uploadImage(dataUrl){
  if(!sb || !S.auth || S.auth.mode!=='account') return dataUrl;   // guest: keep it local
  try{
    const blob = await (await fetch(dataUrl)).blob();
    const ext = (blob.type.split('/')[1]||'jpg').replace('jpeg','jpg');
    const path = `${S.auth.id}/${uid('img')}.${ext}`;
    const { error } = await sb.storage.from('recipe-images')
      .upload(path, blob, { contentType: blob.type, upsert:false });
    if(error) throw error;
    const { data } = await sb.storage.from('recipe-images').createSignedUrl(path, 60*60*24*7);
    if(data && data.signedUrl) IMG_URL[path] = data.signedUrl;
    return path;
  }catch(e){
    console.warn('[mise] image upload failed, keeping it on the device', e);
    return dataUrl;
  }
}
function imgSrc(v){
  if(!v) return '';
  if(v.startsWith('data:')||v.startsWith('http')) return v;
  return IMG_URL[v] || '';
}
async function resolveImages(){
  if(!sb || !S.auth || S.auth.mode!=='account') return;
  const paths = new Set();
  const add = v=>{ if(v && !v.startsWith('data:') && !v.startsWith('http')) paths.add(v); };
  S.recipes.concat(S.drafts, S.imports).forEach(r=>{ add(r.image); (r.gallery||[]).forEach(add); });
  S.collections.forEach(c=>add(c.cover));
  S.history.forEach(x=>add(x.photo));
  const list = [...paths].filter(p=>!IMG_URL[p]);
  if(!list.length) return;
  try{
    const { data } = await sb.storage.from('recipe-images').createSignedUrls(list, 60*60*24*7);
    (data||[]).forEach(d=>{ if(d.signedUrl && d.path) IMG_URL[d.path] = d.signedUrl; });
  }catch(e){ console.warn('[mise] could not sign image urls', e); }
}

/* ---- downscale before anything else touches it ----
   Phone cameras produce 4–12 MB files. Nothing in a recipe app needs that. */
function shrinkImage(dataUrl, maxEdge=1600, quality=0.82){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxEdge/Math.max(img.width, img.height));
      if(scale===1 && dataUrl.length < 900000) return resolve(dataUrl);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=>resolve(dataUrl);
    img.src = dataUrl;
  });
}

/* ---- auth actions ---- */
/* Two different things wear the same button.
   On the device that already holds the library, the email is *attached* to the
   account that library is already in — anything else would strand it under an
   account nobody can sign back into. On a second device, the same button is an
   ordinary sign-in. The difference is whether there is anything here to lose. */
/* Neither a link nor a code — a password. The reasoning, so nobody undoes it:

   iOS gives a home-screen web app its own storage, sealed off from Safari. An
   emailed link therefore signs you in *in Safari*, and the installed app never
   sees that session. Nothing in a web app can cross that boundary; handing a
   link to an installed app needs Universal Links, which needs a native binary.
   So the link flow was not fixable here.

   The obvious replacement — a six-digit code typed inside the app — is blocked
   by the project, not by the code: Supabase will not let you edit the email
   templates without custom SMTP, so {{ .Token }} cannot be added to the magic
   link email, and the default one is link-only. The send limit is also pinned
   at 2/hour and greyed out for the same reason. Both unlock together if custom
   SMTP is ever configured, at which point auth-email-passwordless is a clean
   swap and this comment is the map back.

   So: with "Confirm email" disabled at project level, updateUser({email,password})
   attaches both to the account that already exists, sends nothing, and keeps the
   same user id — which means the library does not move and there is no merge to
   negotiate. That last property is why this is better than a code even when a
   code becomes possible.

   THE COST, stated because it is real: without SMTP there is no reset email. A
   forgotten password means the copy in the account is unreachable (the device
   copy is untouched and still exports). The screen says so plainly rather than
   burying it. */
async function saveAccess(email, password){
  if(!sb){ toast('Not connected right now — your cookbook is still saved here.'); return false; }

  /* Try to claim it for the account we are already in. If the address belongs to
     an account elsewhere, this fails and we sign into that one instead — which
     is the correct behaviour on a second device, and needs no question asked. */
  const { error } = await sb.auth.updateUser({ email, password });
  if(!error) return true;

  const msg = (error.message||'').toLowerCase();
  const taken = msg.includes('already') || msg.includes('registered') ||
                msg.includes('exists')  || msg.includes('in use');
  if(!taken){ toast(error.message||'Could not save that.'); return false; }

  const { error: signInError } = await sb.auth.signInWithPassword({ email, password });
  if(signInError){
    const m=(signInError.message||'').toLowerCase();
    toast(m.includes('credential')||m.includes('invalid')
      ? 'That email already has a cookbook, but the password does not match it.'
      : (signInError.message||'Could not sign in.'));
    return false;
  }
  /* loadRemote() decides what happens to anything already on this device. It
     asks before merging and never discards a side. */
  return true;
}

async function doSignOut(){
  loadedFor = null;
  if(sb) await sb.auth.signOut();
  S.auth = {mode:'guest'};
  SYNC_KEYS.forEach(k=>{ if(Array.isArray(S[k])) S[k]=[]; });
  S.planner={}; S.foodMemory={}; S.prefs=newPrefsDefaults(); S.onboarded=false;
  await localSave();                       /* the device copy goes too */
  setSync('unknown'); reset('intro');
  if(sb) initSync();                       /* and a fresh empty one begins */
}

/* ==========================================================================
   BOOT + INTEGRITY ASSERTION
   ========================================================================== */
function assertNoSeedContent(){
  const bad=[];
  if(S.recipes.length) bad.push('S.recipes');
  if(S.drafts.length) bad.push('S.drafts');
  if(S.imports.length) bad.push('S.imports');
  if(S.collections.length) bad.push('S.collections');
  if(S.list.length) bad.push('S.list');
  if(S.pantry.length) bad.push('S.pantry');
  if(S.history.length) bad.push('S.history');
  if(Object.keys(S.planner).length) bad.push('S.planner');
  if(bad.length){
    throw new Error('SEED CONTENT VIOLATION — the app must launch empty. Populated: '+bad.join(', '));
  }
  console.info('%cMISE','font:600 11px/1 system-ui;letter-spacing:.2em','launched with 0 recipes, as designed.');
}

function tickClock(){
  const el=$('#sb-time'); if(!el) return;
  const d=new Date();
  el.textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
}

async function boot(){
  /* Asserted against the shipped defaults, before anything of the user's is
     restored. What the app comes with is still nothing. */
  assertNoSeedContent();
  tickClock(); setInterval(tickClock,20000);
  S.online=navigator.onLine!==false;
  window.addEventListener('online',()=>{S.online=true;render(true);toast('Back online.')});
  window.addEventListener('offline',()=>{S.online=false;render(true)});
  $('#view').addEventListener('scroll',onScroll,{passive:true});
  wireEvents();
  render();                                   /* splash, immediately */

  const returning = location.hash.includes('access_token') || location.search.includes('code=');

  /* The device copy first — it is local, it is fast, and it is the one that is
     always there. The network is never on the critical path to your own food. */
  const saved = await localLoad();
  if(saved){
    S.localAccount = saved.__account || null;
    applyState(saved);
  }
  localReady = true;

  if(S.onboarded){ reset('library'); }
  else setTimeout(()=>{ if(S.route.name==='splash' && !returning) replace('intro'); },1400);

  /* 'unknown' is a transitional state, so it needs a guaranteed exit. If the
     supabase CDN never settles and initSync returns without reporting, the card
     would sit on 'Checking your backup' forever. Settle it. */
  setTimeout(()=>{ if(S.sync && S.sync.status==='unknown'){ setSync('off'); render(true); } }, 9000);

  /* Then, quietly, the backup. Nothing above waited for it. */
  initSync().then(()=>{
    if(S.onboarded && (S.route.name==='splash'||S.route.name==='intro')) reset('library');
    else render(true);
  });
}
document.addEventListener('DOMContentLoaded',boot);
</script>
