/* ================================================ 20. RECIPE DETAIL ====== */
function starRow(n,interactive,attr){
  return `<span class="stars" ${interactive?`role="radiogroup" aria-label="Your rating"`:`aria-label="${n} out of 5"`}>${[1,2,3,4,5].map(i=>
    `<${interactive?'button':'span'} ${interactive?`${attr}="${i}" aria-label="${i} star${i>1?'s':''}" style="min-height:44px;min-width:26px;display:inline-flex;align-items:center;justify-content:center"`:''}>
      <svg width="${interactive?18:13}" height="${interactive?18:13}" viewBox="0 0 20 20" fill="${i<=n?'currentColor':'none'}" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round">${ICONS.star}</svg>
    </${interactive?'button':'span'}>`).join('')}</span>`;
}
SCREENS.recipe = ({id}) => {
  const r=getRecipe(id);
  if(!r) return SCREENS.error({msg:'That recipe is no longer in your library.'});
  r.viewed=todayISO();
  const mult=S.ui.mult&&S.ui.mult[id]||1;
  const units=S.ui.units&&S.ui.units[id]||S.prefs.units;
  const t=totalTime(r);
  const hist=historyFor(id);
  const rel=relatedTo(r);
  const flagged=(r.diets||[]).length?[]:[];
  const allergenHit=allIngredients(r).filter(i=>S.prefs.allergies.some(a=>a&&normIng(i.name).includes(normIng(a))));

  const meta=[t?['Total',mins(t)]:null, r.prep?['Prep',mins(r.prep)]:null, r.cook?['Cook',mins(r.cook)]:null,
              r.serves?['Serves',String(r.serves)]:null, r.difficulty?['Level',r.difficulty]:null].filter(Boolean);

  const ingHtml=(r.groups||[]).filter(g=>g.items.length).map(g=>`
    ${g.name?`<p class="micro" style="margin:24px 0 10px">${esc(g.name)}</p>`:''}
    <div class="ix" ${g.name?'':'style="border-top:0"'}>
      ${g.items.map(i=>{
        const q=mult!==1?scaleQty(i.qty,mult):i.qty;
        const conv=convertUnit(q,i.unit,units);
        const checked=(S.ui.checked&&S.ui.checked[i.id]);
        return `<div class="ix-row" style="padding:13px 0;min-height:52px;${i.have?'opacity:.5':''}">
          <button class="check ${checked?'on':''}" data-check-ing="${i.id}" role="checkbox" aria-checked="${!!checked}" aria-label="${esc(i.name)}">${ic('check',12,2.2)}</button>
          <span class="ix-b" style="${checked?'text-decoration:line-through;text-decoration-color:var(--ink-30)':''}">
            <span class="ix-t" style="font-weight:400;font-size:15px">
              ${q?`<span class="num" style="font-weight:600">${esc(q)}${i.unit?' '+esc(i.unit):''}</span> `:''}${esc(i.name)}
              ${allergenHit.includes(i)?`<span class="badge clay" style="margin-left:6px">Allergen</span>`:''}
            </span>
            ${conv?`<span class="ix-s">${esc(conv)}${i.note?' · '+esc(i.note):''}</span>`:(i.note?`<span class="ix-s">${esc(i.note)}</span>`:'')}
            ${i.sub?`<span class="ix-s" style="color:var(--olive);white-space:normal">Your swap: ${esc(i.sub)}</span>`:''}
          </span>
          <span class="ix-r">
            <button class="iconbtn" style="width:38px;height:38px" data-ing-menu="${i.id}" aria-label="Options for ${esc(i.name)}">${ic('more',16)}</button>
          </span>
        </div>`;
      }).join('')}
    </div>`).join('');

  return `<div class="screen">
    <header class="topbar" style="position:absolute;top:0;left:0;right:0;background:transparent;z-index:26;border:0">
      <button class="iconbtn" data-back aria-label="Back" style="background:var(--paper);box-shadow:0 1px 6px rgba(0,0,0,.12)">${ic('back',20)}</button>
      <span style="flex:1"></span>
      <span class="tb-act">
        <button class="iconbtn ${r.favourite?'on':''}" data-fav="${r.id}" aria-pressed="${!!r.favourite}" aria-label="Favourite" style="background:var(--paper);box-shadow:0 1px 6px rgba(0,0,0,.12)">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="${r.favourite?'currentColor':'none'}" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round">${ICONS.heart}</svg></button>
        <button class="iconbtn" data-recipe-menu="${r.id}" aria-label="More options" style="background:var(--paper);box-shadow:0 1px 6px rgba(0,0,0,.12)">${ic('more',20)}</button>
      </span>
    </header>

    <div style="position:relative">
      ${r.image?`<figure class="ph" style="aspect-ratio:1/1"><img src="${imgSrc(r.image)}" alt="${esc(r.title)}"></figure>`
        :`<div style="position:relative">
           <figure class="ph" style="aspect-ratio:16/9;position:relative" role="img" aria-label="No photo added yet">
             ${coverArt(r.id+r.title,(ACCENTS.find(a=>a.k===r.accent)||{}).v,'meet')}</figure>
           <button data-add-photo="${r.id}" class="tbtn" style="position:absolute;right:var(--pad);bottom:12px;z-index:3;
             font-size:12px;letter-spacing:.06em;color:var(--ink-60);border-bottom-color:var(--stone);background:var(--paper);padding:6px 10px;min-height:38px">
             ${ic('camera',15)} Add a photo</button>
         </div>`}
    </div>

    <div class="pad" style="padding-top:22px">
      ${r.mealTypes.length||r.cuisine?`<p class="micro">${esc([r.cuisine,...r.mealTypes].filter(Boolean).join(' · '))}</p>`:''}
      <h1 class="d1" style="margin-top:9px">${esc(r.title||'Untitled')}</h1>
      ${r.description?`<p class="serif-it" style="font-size:16px;line-height:1.55;margin:15px 0 0;color:var(--ink-80)">${esc(r.description)}</p>`:''}

      ${(r.source||r.author||r.url||r.platform)?`
        <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--rule)">
          <p class="micro" style="margin-bottom:6px">Source</p>
          <p class="sm" style="margin:0">${esc([r.author,r.source||r.platform].filter(Boolean).join(' — ')||'Added by you')}</p>
          ${r.url?`<a class="sm linky" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer" style="display:inline-flex;gap:6px;align-items:center;margin-top:6px">${ic('link',14)} View the original</a>`:''}
        </div>`:`
        <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--rule)">
          <p class="micro" style="margin-bottom:6px">Source</p><p class="sm" style="margin:0">Yours — written from scratch.</p>
        </div>`}

      ${meta.length?`<div style="display:flex;gap:0;margin-top:20px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)">
        ${meta.map(([k,v])=>`<div style="flex:1;padding:14px 0;text-align:center;position:relative">
          <p class="micro" style="font-size:9px">${k}</p><p class="stat" style="margin-top:6px">${esc(v)}</p></div>`).join('')}
      </div>`:''}

      ${r.diets.length?`<div class="chiprow" style="margin-top:18px">${r.diets.map(d=>`<span class="badge olive">${esc(d)}</span>`).join('')}</div>`:''}

      <div class="actionbar" style="margin-top:22px">
        <button data-plan-add="${r.id}">${ic('planner',18)}<span>Plan</span></button>
        <button data-list-add="${r.id}">${ic('cart',18)}<span>List</span></button>
        <button data-share="${r.id}">${ic('share',18)}<span>Share</span></button>
        <button data-edit="${r.id}">${ic('edit',18)}<span>Edit</span></button>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--rule)">
        <div><p class="micro">Your rating</p></div>
        ${starRow(r.rating,true,'data-rate="'+r.id+'" data-n')}
      </div>
    </div>

    <!-- INGREDIENTS -->
    <section class="sect pad" id="ings">
      <div class="sect-head"><p class="micro">Ingredients</p>
        <button class="micro ink" data-unit-toggle="${r.id}" style="min-height:38px">${units==='metric'?'Metric':'Imperial'} ${ic('rotate',11,2)}</button>
      </div>
      ${allIngredients(r).length?`
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none">
        ${[1,2,3].map(m=>`<button class="chip" data-mult="${r.id}:${m}" aria-pressed="${mult===m}">${m}×</button>`).join('')}
        <button class="chip" data-mult-custom="${r.id}" aria-pressed="${![1,2,3].includes(mult)}">${![1,2,3].includes(mult)?esc(fmtQty(mult))+'×':'Custom'}</button>
        ${mult!==1?`<button class="chip" data-mult="${r.id}:1" style="box-shadow:none;color:var(--ink-45)">Reset to original</button>`:''}
      </div>
      ${mult!==1?`<p class="xs" style="margin:-4px 0 14px">Scaled from the original ${r.serves?`(serves ${esc(r.serves)} → ${esc(fmtQty((parseQty(r.serves)||0)*mult))})`:''}. The original is always one tap away.</p>`:''}
      ${ingHtml}
      <div style="display:flex;gap:16px;margin-top:18px;flex-wrap:wrap">
        <button class="tbtn mutlink" data-list-add="${r.id}">Add all to shopping list</button>
        <button class="tbtn mutlink" data-copy-ings="${r.id}">Copy</button>
      </div>`
      :`<p class="sm" style="margin:0 0 14px">No ingredients on this recipe yet.</p>
        <button class="tbtn" data-edit="${r.id}">Add ingredients ${ic('chev',14,1.6)}</button>`}
    </section>

    <!-- METHOD -->
    <section class="sect pad">
      <div class="sect-head"><p class="micro">Method</p>${r.steps.length?`<span class="xs num">${r.steps.length} steps</span>`:''}</div>
      ${r.steps.length?`<ol style="list-style:none;padding:0;margin:0;counter-reset:st">
        ${r.steps.map((s,i)=>`<li style="display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--rule-soft)">
          <span style="font-family:var(--display);font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--ink-faint);width:22px;flex:0 0 auto;padding-top:5px" class="num">${String(i+1).padStart(2,'0')}</span>
          <span style="flex:1"><span class="body" style="display:block;color:var(--ink)">${esc(s.text)}</span>
          ${s.time?`<span style="display:block"><button class="tbtn mutlink" data-timer="${s.time}" style="margin-top:6px;font-size:12.5px;min-height:38px">${ic('timer',14)} Start ${mins(s.time)} timer</button></span>`:''}</span>
        </li>`).join('')}
      </ol>`:`<p class="sm" style="margin:0 0 14px">No method written yet.</p>
        <button class="tbtn" data-edit="${r.id}">Write the method ${ic('chev',14,1.6)}</button>`}
    </section>

    ${r.notes?`<section class="sect pad">
      <div class="sect-head"><p class="micro">Your notes</p></div>
      <div style="background:var(--cream);padding:18px 20px;border-radius:2px">
        <p class="serif-it" style="font-size:16px;line-height:1.55;margin:0;color:var(--ink-80);white-space:pre-wrap">${esc(r.notes)}</p></div>
    </section>`:''}

    ${(r.subs||r.storage||r.reheat||r.freezer)?`<section class="sect pad">
      <div class="sect-head"><p class="micro">Keeping it</p></div>
      <div class="ix">
        ${[['Substitutions',r.subs],['Storage',r.storage],['Reheating',r.reheat],['Freezing',r.freezer]].filter(([,v])=>v).map(([k,v])=>
          `<div class="ix-row" style="align-items:flex-start;padding:16px 0">
            <span class="ix-b"><span class="micro">${k}</span>
            <span class="body" style="display:block;margin-top:6px;font-size:14.5px">${esc(v)}</span></span></div>`).join('')}
      </div></section>`:''}

    ${(()=>{ const head=nutritionHeadline(r); const has=allIngredients(r).length;
      if(!has && !head) return '';
      return `<section class="sect pad">
      <div class="sect-head"><p class="micro">Nutrition</p>
        ${head?`<button class="micro ink" data-nutrition="${r.id}" style="min-height:38px">Show working ${ic('chev',11,2)}</button>`:''}</div>
      ${head? (head.manual? `
        <div style="display:flex;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)">
          ${[['cal','Energy'],['protein','Protein'],['carbs','Carbs'],['fat','Fat'],['fibre','Fibre']].filter(([k])=>r.nutrition[k]).map(([k,l])=>
            `<div style="flex:1;padding:14px 0;text-align:center"><p class="micro" style="font-size:9px">${l}</p>
             <p class="stat" style="margin-top:5px">${esc(r.nutrition[k])}</p></div>`).join('')}
        </div>
        <p class="xs" style="margin-top:10px">Per serve, as you entered it.</p>`
      : `
        <div style="display:flex;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)">
          ${['kcal','protein','carbs','fat'].map(k=>`<div style="flex:1;padding:14px 0;text-align:center">
            <p class="micro" style="font-size:9px">${NUT_LABEL[k]}</p>
            <p class="stat" style="margin-top:6px">${head.n.perServe[k]==null?'—':(k==='kcal'?(S.prefs.energyUnit==='kj'?kj(head.n.perServe.kcal):Math.round(head.n.perServe.kcal)):Math.round(head.n.perServe[k])+'g')}</p></div>`).join('')}
        </div>
        <p class="xs" style="margin-top:10px;max-width:36ch">
          ${head.complete
            ? `Per serve, computed from all ${head.total} ingredients.`
            : `<span style="color:var(--clay-ink)">Incomplete — computed from ${head.matched} of ${head.total} ingredients.</span> Treat it as a floor, not a total.`}
        </p>
        ${head.complete?`<div style="margin-top:14px"><button class="btn sm quiet" data-health-log="${r.id}" style="width:auto">${ic('flame',15)} Send to Apple Health</button></div>`:''}`)
      : `
        <p class="sm" style="margin:0 0 14px;max-width:34ch">Not calculated. ${BRANDS[S.brand].mark} won’t estimate this — match the ingredients to foods and it will do the arithmetic, showing its working.</p>
        <button class="tbtn" data-nutrition="${r.id}">Work out the calories ${ic('chev',14,1.6)}</button>`}
    </section>`; })()}

    <section class="sect pad">
      <div class="sect-head"><p class="micro">Cooking history</p>
        ${hist.length?`<button class="micro ink" data-log-cook="${r.id}" style="min-height:38px">Log a cook</button>`:''}</div>
      ${hist.length?`<div class="ix">${hist.map(h=>`
        <div class="ix-row" style="align-items:flex-start;padding:16px 0">
          <span class="ix-n" style="width:auto;min-width:52px">${fmtDate(h.date)}</span>
          <span class="ix-b">
            ${h.rating?starRow(h.rating):''}
            ${h.notes?`<span class="ix-s" style="white-space:normal;color:var(--ink-80);margin-top:4px">${esc(h.notes)}</span>`:''}
            ${h.forWho?`<span class="ix-s">For ${esc(h.forWho)}</span>`:''}
            ${h.again!=null?`<span class="ix-s">${h.again?'Would cook again':'Probably not again'}</span>`:''}
          </span>
          ${h.photo?`<span class="ix-r"><img src="${imgSrc(h.photo)}" alt="" style="width:44px;height:44px;object-fit:cover"></span>`:''}
        </div>`).join('')}</div>`
      :`<p class="sm" style="margin:0 0 16px;max-width:32ch">You haven't cooked this yet. Once you do, what you changed and how it went lives here.</p>
        <button class="tbtn" data-log-cook="${r.id}">Log a cook ${ic('chev',14,1.6)}</button>`}
    </section>

    ${rel.length?`<section class="sect">
      <div class="sect-head pad"><p class="micro">Elsewhere in your library</p></div>
      <div style="display:flex;gap:14px;overflow-x:auto;padding:0 var(--pad) 4px;scrollbar-width:none">
        ${rel.map(x=>`<div style="width:132px;flex:0 0 auto">${recipeTile(x)}</div>`).join('')}</div>
    </section>`:''}

    <div class="pad" style="padding-top:34px;padding-bottom:20px">
      <p class="xs">Added ${fmtDate(r.added,true)}${r.lastCooked?` · last cooked ${fmtDate(r.lastCooked,true)}`:''}${r.cookCount?` · cooked ${r.cookCount}×`:''}</p>
    </div>
    <div style="height:96px"></div>

    <div style="position:absolute;left:0;right:0;bottom:0;padding:12px var(--pad) calc(14px + var(--safe-b));
      background:var(--paper);border-top:1px solid var(--rule);z-index:24;pointer-events:none">
      <div style="display:flex;gap:10px;pointer-events:auto">
        <button class="btn" data-cook="${r.id}" ${r.steps.length?'':'disabled'} style="flex:1">${ic('flame',17)} Start cooking</button>
        <button class="btn ghost" data-mark-cooked="${r.id}" style="width:auto;padding:0 18px;background:var(--paper)" aria-label="Mark as cooked">${ic('check',18)}</button>
      </div>
    </div>
  </div>`;
};
/* ================================================= 8. ADD MENU (sheet) === */
function sheetAdd(){
  const order = S.prefs.capture||[];
  const items=[
    {k:'manual',title:'Create manually',sub:'A blank page, your words',icon:'edit'},
    {k:'url',   title:'Import from a website',sub:'Paste any recipe link',icon:'link'},
    {k:'social',title:'Import from Instagram, TikTok or YouTube',sub:'Keeps the creator’s name and link',icon:'play'},
    {k:'paste', title:'Paste recipe text',sub:'From a note, email or message',icon:'text'},
    {k:'shot',  title:'Upload a screenshot',sub:'Clear out the camera roll',icon:'image'},
    {k:'scan',  title:'Photograph a cookbook page',sub:'Then tidy it up',icon:'camera'},
    {k:'hand',  title:'Scan a handwritten recipe',sub:'The card in your grandmother’s hand',icon:'scan'},
    {k:'dupe',  title:'Duplicate an existing recipe',sub:'Start from one you already have',icon:'copy',disabled:!liveRecipes().length},
  ];
  const weight=k=>{
    const m={url:['Websites'],social:['Instagram','TikTok','YouTube'],shot:['Screenshots'],scan:['Cookbooks'],hand:['Handwritten cards'],manual:['My own head']};
    return (m[k]||[]).some(x=>order.includes(x))?0:1;
  };
  items.sort((a,b)=>weight(a.k)-weight(b.k));
  return `<div class="sheet-h"><h2 class="d4">Add a recipe</h2>
    <button class="iconbtn" data-dismiss aria-label="Close">${ic('close',18)}</button></div>
  <div class="sheet-b">
    <p class="sm" style="margin:6px 0 18px;max-width:34ch">However it reaches you, it ends up in your library — and nowhere else.</p>
    ${ixList(items.map(i=>({title:i.title,sub:i.sub,icon:i.icon,disabled:i.disabled,attrs:`data-import="${i.k}"`,n:false})))}
    <p class="xs" style="margin-top:20px;max-width:38ch">Imported recipes keep their original source and creator, stay private to you, and are never published or shared unless you choose to.</p>
  </div>`;
}

function startEdit(id,opts={}){
  const src=id?getRecipe(id):null;
  S.ui.editing = src ? JSON.parse(JSON.stringify(src)) : newRecipe(opts.patch||{});
  S.ui.editingIsNew = !src;
  S.ui.editSection = 0;
  go('edit',{id:S.ui.editing.id});
}
const EDIT_SECTIONS=['The basics','Ingredients','Method','Details','Notes & keeping','Nutrition'];
SCREENS.edit = () => {
  const r=S.ui.editing;
  if(!r) return SCREENS.error({msg:'Nothing open to edit.'});
  const sec=S.ui.editSection||0;
  const isDraft=S.drafts.some(d=>d.id===r.id);
  const inLib=S.recipes.some(x=>x.id===r.id);

  const body=[basics,ingredients,method,details,notesSec,nutritionSec][sec](r);

  function basics(r){ return `
    <div class="field ${r.title?'':''}">
      <label class="micro">Title</label>
      <textarea class="serifin" data-grow data-f="title" rows="1" placeholder="What do you call this?" data-autofocus>${esc(r.title)}</textarea>
    </div>
    <div class="field"><label class="micro">Your description</label>
      <textarea data-grow data-f="description" rows="1" placeholder="Why you make it. What it’s for. Optional.">${esc(r.description)}</textarea></div>
    <div style="padding:26px 0 0">
      <p class="micro" style="margin-bottom:12px">Cover photo</p>
      ${r.image?`<div style="position:relative"><figure class="ph" style="aspect-ratio:4/3"><img src="${imgSrc(r.image)}" alt=""></figure>
        <div style="display:flex;gap:16px;margin-top:12px"><button class="tbtn mutlink" data-edit-photo>Replace</button>
        <button class="tbtn mutlink" data-remove-photo>Remove</button></div></div>`
      :`<div style="display:flex;gap:10px">
          <button class="btn ghost sm" data-edit-photo style="flex:1">${ic('image',16)} Choose</button>
          <button class="btn ghost sm" data-edit-photo-cam style="flex:1">${ic('camera',16)} Take one</button>
        </div>
        <p class="xs" style="margin-top:10px;max-width:34ch">Until you add one, ${BRANDS[S.brand].mark} sets the title in type over a drawn cover. No stock photography, ever.</p>
        <div style="margin-top:16px"><p class="micro" style="margin-bottom:10px">Or pick a cover accent</p>
        <div class="chiprow">${ACCENTS.map(a=>`<button class="chip" data-accent="${a.k}" aria-pressed="${r.accent===a.k}">
          <span style="width:11px;height:11px;border-radius:50%;background:${a.v};display:inline-block"></span>${a.k}</button>`).join('')}</div></div>`}
    </div>`;
  }
  function ingredients(r){ return `
    ${r.groups.map((g,gi)=>`
      <div style="margin-bottom:26px">
        <div style="display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule);padding-bottom:8px">
          <input data-fg="${gi}" value="${esc(g.name)}" placeholder="${gi===0?'Ingredients (or name this group)':'Group name'}"
            class="micro" style="flex:1;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)">
          ${r.groups.length>1?`<button class="iconbtn" style="width:38px;height:38px" data-del-group="${gi}" aria-label="Remove group">${ic('trash',15)}</button>`:''}
        </div>
        ${g.items.map((i,ii)=>`
          <div style="display:flex;gap:8px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--rule-soft)">
            <span class="ix-ic" style="width:16px;color:var(--ink-30);padding-top:8px" data-reorder>${ic('drag',14)}</span>
            <input data-fi="${gi}:${ii}:qty" value="${esc(i.qty)}" placeholder="2" inputmode="decimal"
              style="width:44px;text-align:right;font-variant-numeric:tabular-nums" aria-label="Quantity">
            <input data-fi="${gi}:${ii}:unit" value="${esc(i.unit)}" placeholder="tbsp" style="width:52px" aria-label="Unit">
            <input data-fi="${gi}:${ii}:name" value="${esc(i.name)}" placeholder="ingredient" style="flex:1;min-width:0" aria-label="Ingredient">
            <button class="iconbtn" style="width:38px;height:38px;flex:0 0 auto" data-del-ing="${gi}:${ii}" aria-label="Remove">${ic('close',14)}</button>
          </div>`).join('')}
        <button class="tbtn mutlink" data-add-ing="${gi}" style="margin-top:12px">${ic('plus',14)} Add ingredient</button>
      </div>`).join('')}
    <div class="rule"></div>

  }
  function method(r){ return `
    ${r.steps.length?r.steps.map((s,i)=>`
      <div style="display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--rule-soft)">

      <p class="micro" style="margin-bottom:8px">Shortcut</p>

    </div>
    <p class="xs" style="margin-top:18px;max-width:36ch">Any step that mentions a time gets a tappable timer in cooking mode automatically.</p>`;
  }
  function details(r){ return `
    <div class="grid2">
      <div class="field"><label class="micro">Prep (min)</label><input data-f="prep" value="${esc(r.prep)}" inputmode="numeric" placeholder="15"></div>
      <div class="field"><label class="micro">Cook (min)</label><input data-f="cook" value="${esc(r.cook)}" inputmode="numeric" placeholder="30"></div>
      <div class="field"><label class="micro">Serves</label><input data-f="serves" value="${esc(r.serves)}" inputmode="numeric" placeholder="${S.prefs.household}"></div>
      <div class="field"><label class="micro">Cuisine</label><input data-f="cuisine" value="${esc(r.cuisine)}" placeholder="Optional"></div>
    </div>
    ${totalTime(r)?`<p class="xs" style="margin-top:10px">Total ${mins(totalTime(r))}</p>`:''}
    <div class="fieldset"><p class="micro" style="margin-bottom:11px">Difficulty</p>
      <div class="chiprow">${DIFF.map(d=>`<button class="chip" data-set="difficulty:${d}" aria-pressed="${r.difficulty===d}">${d}</button>`).join('')}</div></div>
    <div class="fieldset"><p class="micro" style="margin-bottom:11px">Meal</p>
      <div class="chiprow">${MEALS.map(d=>`<button class="chip" data-toggle="mealTypes:${d}" aria-pressed="${r.mealTypes.includes(d)}">${d}</button>`).join('')}</div></div>
    <div class="fieldset"><p class="micro" style="margin-bottom:11px">Method</p>
      <div class="chiprow">${METHODS.map(d=>`<button class="chip" data-toggle="methods:${d}" aria-pressed="${r.methods.includes(d)}">${d}</button>`).join('')}</div></div>
    <div class="fieldset"><p class="micro" style="margin-bottom:11px">Dietary labels</p>
      <div class="chiprow">${DIETS.map(d=>`<button class="chip acc" data-toggle="diets:${d}" aria-pressed="${r.diets.includes(d)}">${d}</button>`).join('')}</div></div>
    <div class="fieldset"><p class="micro" style="margin-bottom:11px">Your tags</p>
      <div class="field focus" style="border-bottom-color:var(--ink)"><input data-tag-in placeholder="Add a tag and press enter"></div>
      ${r.tags.length?`<div class="chiprow" style="margin-top:14px">${r.tags.map(t=>`<button class="chip on" data-untag="${esc(t)}">${esc(t)} ${ic('close',12,1.8)}</button>`).join('')}</div>`:''}</div>
    <div class="fieldset"><p class="micro" style="margin-bottom:11px">Collections</p>
      ${S.collections.length?`<div class="chiprow">${S.collections.map(c=>`<button class="chip" data-toggle="collections:${c.id}" aria-pressed="${r.collections.includes(c.id)}">${esc(c.name)}</button>`).join('')}
        <button class="chip" data-new-collection>${ic('plus',13)} New</button></div>`
      :`<button class="tbtn mutlink" data-new-collection>${ic('plus',14)} Create your first collection</button>`}</div>
    <div class="fieldset"><p class="micro" style="margin-bottom:4px">Where it came from</p>
      <div class="field"><label class="micro">Source</label><input data-f="source" value="${esc(r.source)}" placeholder="A cookbook, a person, a site"></div>
      <div class="field"><label class="micro">Original author</label><input data-f="author" value="${esc(r.author)}" placeholder="Who wrote it"></div>
      <div class="field"><label class="micro">Link</label><input data-f="url" value="${esc(r.url)}" inputmode="url" placeholder="https://"></div>
      <p class="xs" style="margin-top:12px;max-width:36ch">If a recipe isn’t yours, credit stays attached to it. That’s both decent and, if you ever share it, necessary.</p>
    </div>`;
  }
  function notesSec(r){ return `
    <div class="field"><label class="micro">Your notes</label>
      <textarea data-grow data-f="notes" rows="2" placeholder="What you changed. What went wrong. What to do next time.">${esc(r.notes)}</textarea></div>
    <div class="field"><label class="micro">Substitutions that work</label>
      <textarea data-grow data-f="subs" rows="1" placeholder="Swap X for Y">${esc(r.subs)}</textarea></div>
    <div class="field"><label class="micro">Storage</label>
      <textarea data-grow data-f="storage" rows="1" placeholder="Keeps 3 days, covered">${esc(r.storage)}</textarea></div>
    <div class="field"><label class="micro">Reheating</label>
      <textarea data-grow data-f="reheat" rows="1" placeholder="Low oven, 12 min">${esc(r.reheat)}</textarea></div>
    <div class="field"><label class="micro">Freezing</label>
      <textarea data-grow data-f="freezer" rows="1" placeholder="Freezes well before baking">${esc(r.freezer)}</textarea></div>`;
  }
  function nutritionSec(r){ return `
    <p class="sm" style="margin:0 0 20px;max-width:34ch">Per serve. Type them off the packet here, or leave this blank and let ${BRANDS[S.brand].mark} compute them from ingredients you’ve matched — it shows its working and never estimates.</p>
    <div class="grid2">
      ${[['cal','Calories'],['protein','Protein (g)'],['carbs','Carbs (g)'],['fat','Fat (g)'],['fibre','Fibre (g)']].map(([k,l])=>
        `<div class="field"><label class="micro">${l}</label><input data-fn="${k}" value="${esc(r.nutrition[k]||'')}" inputmode="decimal" placeholder="—"></div>`).join('')}

  return `<div class="screen">
    ${topbar({close:true,title:r.title||'New recipe',actions:`<button class="micro ink" data-save-draft style="min-height:44px;padding:0 8px">Save draft</button>`})}

    <div class="pad" style="padding:18px 22px calc(18px + var(--safe-b));border-top:1px solid var(--rule);background:var(--paper);position:sticky;bottom:0;z-index:20">

        ${sec>0?`<button class="btn ghost" data-edit-sec="${sec-1}" style="width:auto;padding:0 18px" aria-label="Previous section">${ic('back',18)}</button>`:''}
        ${sec<EDIT_SECTIONS.length-1
          ?`<button class="btn" data-edit-sec="${sec+1}" style="flex:1">Next — ${EDIT_SECTIONS[sec+1]}</button>`
          :`<button class="btn" data-save-recipe style="flex:1">${inLib?'Save changes':'Add to my library'}</button>`}
        ${sec<EDIT_SECTIONS.length-1?`<button class="btn quiet" data-save-recipe style="width:auto;padding:0 20px"
          aria-label="${inLib?'Save changes and finish':'Add to my library now'}" title="${inLib?'Save changes':'Add to my library'}">${ic('check',19,1.8)}</button>`:''}
      </div>
      ${!r.title.trim()?`<p class="xs" style="margin-top:10px;text-align:center">A title is the only thing required.</p>`:''}
    </div>
  </div>`;
};

/* ================================================= 15. IMPORT REVIEW ==== */
SCREENS.review = ({id})=>{
  const r=S.imports.find(x=>x.id===id)||S.ui.editing;
  if(!r) return SCREENS.error({msg:'That import is no longer waiting.'});
  const inc=r.incomplete||[];
  const flag=k=>inc.includes(k)?`<span class="badge clay" style="margin-left:8px">Needs you</span>`:'';
  const ings=allIngredients(r);
  const noQty=ings.filter(i=>!i.qty).length;

  return `<div class="screen">
    ${topbar({close:true,title:'Review before saving'})}
    <div class="pad" style="padding-top:8px">
      <p class="micro">Not saved yet</p>
      <h1 class="d2" style="margin-top:9px">Check this over.</h1>
      <p class="sm" style="margin:12px 0 0;max-width:34ch">${inc.length
        ? `We read what we could. <strong style="color:var(--clay-ink)">${inc.length} ${plural(inc.length,'field')}</strong> couldn’t be determined and ${inc.length===1?'has':'have'} been left blank rather than guessed.`
        : `Everything came across cleanly. Still worth a glance — imports are often formatted oddly.`}</p>
    </div>

    ${r.image?`<div class="pad" style="padding-top:22px"><figure class="ph" style="aspect-ratio:16/10"><img src="${imgSrc(r.image)}" alt=""></figure></div>`:''}

    <section class="sect pad">
      <div class="sect-head"><p class="micro">Attribution</p><span class="badge">${ic('lock',12)} Kept with the recipe</span></div>
      <div class="field"><label class="micro">Original creator${flag('author')}</label>
        <input data-rf="author" value="${esc(r.author)}" placeholder="Who made this"></div>
      <div class="field"><label class="micro">Source</label>
        <input data-rf="source" value="${esc(r.source||r.platform||'')}" placeholder="Site, platform or book"></div>
      <div class="field"><label class="micro">Link</label>
        <input data-rf="url" value="${esc(r.url)}" inputmode="url" placeholder="https://"></div>
    </section>

    <section class="sect pad">
      <div class="sect-head"><p class="micro">The recipe</p></div>
      <div class="field"><label class="micro">Title${flag('title')}</label>
        <textarea class="serifin" data-grow data-rf="title" rows="1" placeholder="Give it a name">${esc(r.title)}</textarea></div>
      <div class="grid2">
        <div class="field"><label class="micro">Serves${flag('serves')}</label><input data-rf="serves" value="${esc(r.serves)}" inputmode="numeric" placeholder="—"></div>
        <div class="field"><label class="micro">Prep (min)</label><input data-rf="prep" value="${esc(r.prep)}" inputmode="numeric" placeholder="—"></div>
        <div class="field"><label class="micro">Cook (min)${flag('time')}</label><input data-rf="cook" value="${esc(r.cook)}" inputmode="numeric" placeholder="—"></div>
        <div class="field"><label class="micro">Total</label><input value="${totalTime(r)?mins(totalTime(r)):''}" placeholder="—" readonly aria-readonly="true" style="color:var(--ink-45)"></div>
      </div>
    </section>

    <section class="sect pad">
      <div class="sect-head"><p class="micro">Ingredients — ${ings.length} found${flag('ingredients')}</p>
        <button class="micro ink" data-review-edit="${r.id}:1" style="min-height:38px">Edit ${ic('chev',11,2)}</button></div>
      ${ings.length?`<div class="ix">${ings.slice(0,40).map(i=>`
        <div class="ix-row" style="padding:11px 0;min-height:auto">
          <span class="ix-b"><span class="ix-t" style="font-weight:400">
            ${i.qty?`<span class="num" style="font-weight:600">${esc(i.qty)}${i.unit?' '+esc(i.unit):''}</span> `:`<span class="badge clay" style="margin-right:8px">No qty</span>`}${esc(i.name)}</span></span>
        </div>`).join('')}</div>
        ${noQty?`<p class="xs" style="margin-top:12px;color:var(--clay-ink)">${noQty} ${plural(noQty,'ingredient')} came through without a quantity. Add them if you know them — they’ve deliberately been left empty.</p>`:''}`
      :`<div style="padding:20px;background:var(--clay-wash);border-radius:2px">
          <p class="sm" style="margin:0;color:var(--ink)">${ic('warn',15)} No ingredients could be read from this source. Nothing has been invented — open the editor and add them.</p></div>`}
    </section>

    <section class="sect pad">
      <div class="sect-head"><p class="micro">Method — ${r.steps.length} ${plural(r.steps.length,'step')}${flag('steps')}</p>
        <button class="micro ink" data-review-edit="${r.id}:2" style="min-height:38px">Edit ${ic('chev',11,2)}</button></div>
      ${r.steps.length?`<ol style="list-style:none;padding:0;margin:0">${r.steps.slice(0,20).map((s,i)=>`
        <li style="display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--rule-soft)">
          <span class="num" style="font-family:var(--display);font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--ink-faint);width:20px">${String(i+1).padStart(2,'0')}</span>
          <span class="sm" style="color:var(--ink-80);flex:1">${esc(s.text)}</span></li>`).join('')}</ol>`
      :`<div style="padding:20px;background:var(--clay-wash);border-radius:2px">
          <p class="sm" style="margin:0;color:var(--ink)">${ic('warn',15)} No method could be read. ${BRANDS[S.brand].mark} will not write cooking instructions for you unless you explicitly ask it to.</p></div>`}
    </section>

    ${r.notes?`<section class="sect pad"><div class="sect-head"><p class="micro">Notes found in the source</p></div>

    <section class="sect pad">
      <div class="sect-head"><p class="micro">File it</p></div>
      <div class="chiprow">${MEALS.slice(0,5).map(m=>`<button class="chip" data-rtoggle="mealTypes:${m}" aria-pressed="${r.mealTypes.includes(m)}">${m}</button>`).join('')}</div>
      ${S.collections.length?`<div class="chiprow" style="margin-top:12px">${S.collections.map(c=>
        `<button class="chip" data-rtoggle="collections:${c.id}" aria-pressed="${r.collections.includes(c.id)}">${esc(c.name)}</button>`).join('')}</div>`:''}
    </section>

    <div class="pad" style="padding-top:34px;padding-bottom:calc(20px + var(--safe-b));display:flex;flex-direction:column;gap:10px">
      <button class="btn" data-review-save="${r.id}" ${r.title.trim()?'':'disabled'}>Save to my library</button>
      <div style="display:flex;gap:10px">
        <button class="btn ghost" data-review-open="${r.id}" style="flex:1">Open full editor</button>
        <button class="btn ghost" data-review-discard="${r.id}" style="flex:1">Discard</button>
      </div>
      <p class="xs" style="margin-top:6px;text-align:center">Stays private to you. Nothing is published.</p>
    </div>
  </div>`;
};
/* ============================================ 17–19. SEARCH ============= */
const SEARCH_HINTS=['meals under 30 minutes','things I haven’t cooked yet','recipes from Instagram','my highest-rated pasta','dinners with my notes','vegetarian, quick'];
function activeFilterCount(){ const f=S.ui.filters;
  return (f.diets||[]).length+(f.meals||[]).length+(f.methods||[]).length+(f.maxTime?1:0)+(f.minRating?1:0)+(f.collection?1:0)+(f.tag?1:0)+(f.source?1:0)+(f.uncooked?1:0); }

SCREENS.search = ()=>{
  const all=liveRecipes();
  const q=S.ui.q;
  const nf=activeFilterCount();
  const results=(q.trim()||nf)?runSearch(q):[];
  const showResults=!!(q.trim()||nf);
  const parsed=q.trim()?parseQuery(q):null;
  const understood=parsed?[
    parsed.under?`under ${parsed.under} min`:null,
    parsed.uncooked?'not yet cooked':null,
    parsed.platform?`from ${parsed.platform}`:null,
    parsed.minRating?'highly rated':null,
    parsed.favourite?'favourites':null,
    parsed.notes?'with your notes':null,
    ...parsed.diets, ...parsed.meals,
    ...parsed.terms.map(t=>`“${t}”`)
  ].filter(Boolean):[];

  const allTags=[...new Set(all.flatMap(r=>r.tags))];

  return `<div class="screen">
    <header class="topbar" style="padding-top:2px;gap:8px">
      <span style="flex:1;display:flex;align-items:center;gap:10px;border-bottom:1px solid ${q?'var(--ink)':'var(--rule)'};padding:6px 0">
        <span style="color:var(--ink-45)">${ic('search',18)}</span>
        <input data-q value="${esc(q)}" placeholder="Search your library" aria-label="Search your recipes"
          style="flex:1;font-size:16px;min-height:40px" autocomplete="off" ${all.length?'':'disabled'}>
        ${q?`<button class="iconbtn" style="width:38px;height:38px" data-clear-q aria-label="Clear">${ic('close',15)}</button>`:''}
      </span>
      <button class="iconbtn" data-filters aria-label="Filters" style="position:relative">${ic('filter',20)}
        ${nf?`<span style="position:absolute;top:5px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--clay)"></span>`:''}</button>
    </header>

    ${!all.length?`<div class="grow" style="padding-top:24px">${emptyState({
        title:'Nothing to search yet.',
        sub:'Search only ever looks inside your own library — it will never suggest a recipe you haven’t saved.',
        figure:FIG.arcs,
        actions:`<button class="tbtn" data-new-recipe>Add your first recipe ${ic('chev',14,1.6)}</button>`
      })}</div>`
    : !showResults?`
      <div class="grow pad" style="padding-top:16px">
        <p class="micro" style="margin-bottom:14px">Ask in your own words</p>

      <h1 class="d1" style="margin-top:9px">${esc(c.name)}</h1>

/* ================================================= 27/28. PLANNER ======= */
SCREENS.planner = ()=>{
  const start=S.ui.weekStart||weekStart(todayISO());
  const days=weekDays(start);
  const all=liveRecipes();
  const totalMeals=days.reduce((n,d)=>n+planFor(d).length,0);
  const label=`${fmtDate(days[0])} – ${fmtDate(days[6])}`;

  const head=`<header class="topbar" style="padding-top:2px">
    <button class="iconbtn" data-week="-1" aria-label="Previous week">${ic('back',20)}</button>
    <span style="flex:1;text-align:center"><span class="micro ink" style="display:block">${start===weekStart(todayISO())?'This week':'Week of'}</span>
      <span class="xs" style="display:block">${label}</span></span>
    <button class="iconbtn" data-week="1" aria-label="Next week">${ic('chev',20)}</button>
  </header>`;

  if(!all.length){
    return `<div class="screen">${head}
      <div class="grow" style="padding-top:26px">${emptyState({
        title:'Plan the week from your own shelf.',
        sub:'The planner only ever draws on recipes you’ve saved. Add one and this comes alive.',
        figure:FIG.cal,
        actions:`<button class="tbtn" data-new-recipe>Add a recipe ${ic('chev',14,1.6)}</button>`
      })}</div><div class="tab-space"></div></div>`;
  }

  return `<div class="screen">${head}
    <div class="pad" style="padding-top:4px;display:flex;align-items:baseline;justify-content:space-between;gap:12px">
      <h1 class="d3">${totalMeals?`${totalMeals} ${plural(totalMeals,'meal')} planned`:'Nothing planned yet'}</h1>
    </div>
    ${totalMeals?`<div class="pad" style="padding-top:16px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn sm quiet" data-plan-to-list>${ic('cart',15)} Build shopping list</button>
      <button class="btn sm quiet" data-save-week>${ic('bookmark',15)} Save this week</button>
      <button class="btn sm quiet" data-clear-week>Clear</button>
    </div>`:`<div class="pad" style="padding-top:14px"><p class="sm" style="max-width:32ch;margin:0">Tap any slot to drop in something from your library. Drag to move meals between days.</p></div>`}

    <div class="pad" style="padding-top:22px">
      ${days.map(d=>{
        const entries=planFor(d);
        const isToday=d===todayISO();
        const dt=new Date(d+'T00:00:00');
        const prepTime=entries.reduce((n,e)=>{const r=getRecipe(e.recipeId);return n+(r?(totalTime(r)||0):0)},0);
        return `<section data-day="${d}" style="border-top:1px solid ${isToday?'var(--ink)':'var(--rule)'};padding:14px 0 6px">
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px">
            <div style="display:flex;align-items:baseline;gap:10px">
              <span class="d4" style="font-weight:500;${isToday?'':'color:var(--ink-45)'}">${dt.toLocaleDateString('en-GB',{weekday:'long'})}</span>
              <span class="xs num">${dt.getDate()}</span>
              ${isToday?'<span class="badge clay">Today</span>':''}
            </div>
            ${prepTime?`<span class="xs num">${mins(prepTime)}</span>`:''}
          </div>
          ${entries.length?entries.map(e=>{
            const r=e.recipeId?getRecipe(e.recipeId):null;
            return `<div class="ix-row" draggable="true" data-entry="${d}:${e.id}" style="border-bottom:1px solid var(--rule-soft);padding:10px 0;min-height:52px;${e.cooked?'opacity:.5':''}">
              <span class="ix-n" style="width:auto;min-width:44px;font-family:var(--sans);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-45)">${esc(e.slot)}</span>
              ${r?`<span class="ix-ic" style="width:34px">${media(r)}</span>`:''}
              <span class="ix-b"><span class="ix-t" style="${e.cooked?'text-decoration:line-through':''}">${esc(r?r.title:e.note)}</span>
                <span class="ix-s">${[e.leftover?'Leftovers':'',e.servings?`Serves ${e.servings}`:'',e.cooked?'Cooked':''].filter(Boolean).join(' · ')||(r?mins(totalTime(r)):'')}</span></span>
              <span class="ix-r"><button class="iconbtn" style="width:38px;height:38px" data-entry-menu="${d}:${e.id}" aria-label="Meal options">${ic('more',16)}</button></span>
            </div>`;
          }).join(''):''}
          <button class="ix-row" data-add-meal="${d}" style="border-bottom:0;color:var(--ink-30);padding:10px 0;min-height:46px">
            <span class="ix-ic" style="width:20px">${ic('plus',16)}</span>
            <span class="ix-b"><span class="ix-t" style="font-weight:500;color:var(--ink-45)">Add a meal</span></span></button>
        </section>`;
      }).join('')}
    </div>
    <div class="pad sect">
      ${ixList([
        {title:'Shopping list',sub:S.list.length?S.list.filter(i=>!i.checked).length+' items outstanding':'Empty',icon:'cart',attrs:'data-go="shopping"',n:false},
        {title:'Pantry',sub:S.pantry.length?(S.pantry.length+' things in'):'Nothing recorded',icon:'pantry',attrs:'data-go="pantry"',n:false},
      ])}
    </div>
    <div class="tab-space"></div></div>`;
};

/* ================================================ 29/30. SHOPPING ======= */

  const items=S.list.filter(i=>!i.excluded);
  const excluded=S.list.filter(i=>i.excluded);
  const open=items.filter(i=>!i.checked);
  const done=items.filter(i=>i.checked);
  const byCat={};
  open.forEach(i=>{ (byCat[i.cat]=byCat[i.cat]||[]).push(i); });

  return `<div class="screen">
    ${topbar({title:'Shopping list',actions:`
      ${S.list.length?`<button class="iconbtn" data-share-list aria-label="Share list">${ic('share',20)}</button>`:''}
      <button class="iconbtn" data-add-list-item aria-label="Add an item">${ic('plus',20)}</button>`})}
    ${bigTitle('Shopping list', S.list.length?`${open.length} to get${done.length?` · ${done.length} in the basket`:''}`:'')}
    <div class="grow pad">
      ${!S.list.length?emptyState({
        title:'Nothing on the list.',
        sub:'Add the ingredients from a recipe, pull a whole week from your planner, or just type something in.',
        figure:FIG.basket,
        actions:ixList([
          {title:'Add from a recipe',sub:liveRecipes().length?'Pick from your library':'You’ll need a recipe first',icon:'library',attrs:liveRecipes().length?'data-list-from-recipe':'data-new-recipe',n:false},
          {title:'Build from this week’s plan',sub:Object.values(S.planner).flat().length?'Combines and de-duplicates':'Nothing planned yet',icon:'planner',attrs:'data-plan-to-list',n:false,disabled:!Object.values(S.planner).flat().length},
          {title:'Add an item by hand',sub:'Milk, bin bags, whatever',icon:'plus',attrs:'data-add-list-item',n:false},
        ])
      }):`
        ${GROCERY.filter(c=>byCat[c]).map(c=>`
          <section style="margin-bottom:8px">
            <p class="micro" style="padding:22px 0 8px">${c}</p>
            <div class="ix">${byCat[c].map(i=>listRow(i)).join('')}</div>
          </section>`).join('')}
        ${done.length?`<section style="margin-top:26px">
          <div class="sect-head" style="margin-bottom:8px"><p class="micro">In the basket</p>
            <button class="micro ink" data-clear-checked style="min-height:38px">Clear</button></div>
          <div class="ix">${done.map(i=>listRow(i)).join('')}</div></section>`:''}
        ${excluded.length?`<section style="margin-top:26px">
          <p class="micro" style="margin-bottom:8px">Excluded — ${excluded.length}</p>
          <div class="ix">${excluded.map(i=>`<div class="ix-row" style="opacity:.5;padding:12px 0">
            <span class="ix-b"><span class="ix-t" style="font-weight:400">${esc(i.name)}</span></span>
            <span class="ix-r"><button class="micro ink" data-restore-item="${i.id}" style="min-height:38px">Restore</button></span></div>`).join('')}</div></section>`:''}
        <div style="margin-top:30px;display:flex;flex-direction:column;gap:2px;align-items:flex-start">
          <button class="tbtn mutlink" data-add-list-item>${ic('plus',14)} Add an item</button>
          <button class="tbtn mutlink" data-copy-list>Copy the list as text</button>
          <button class="tbtn mutlink" data-clear-list>Empty the list</button>
        </div>`}
    </div><div class="tab-space"></div></div>`;
};
function listRow(i){
  const froms=(i.from||[]).filter(f=>f.title);
  return `<div class="ix-row" style="padding:12px 0;min-height:54px">
    <button class="check ${i.checked?'on':''}" data-check-item="${i.id}" role="checkbox" aria-checked="${i.checked}" aria-label="${esc(i.name)}">${ic('check',12,2.2)}</button>
    <span class="ix-b" style="${i.checked?'text-decoration:line-through;text-decoration-color:var(--ink-30);opacity:.55':''}">
      <span class="ix-t" style="font-weight:400;font-size:15px">${i.qty?`<span class="num" style="font-weight:600">${esc(i.qty)}${i.unit?' '+esc(i.unit):''}</span> `:''}${esc(i.name)}</span>
      ${froms.length?`<span class="ix-s">${froms.map(f=>esc(f.title)).join(', ')}</span>`:(i.manual?'<span class="ix-s">Added by hand</span>':'')}
    </span>
    <span class="ix-r"><button class="iconbtn" style="width:38px;height:38px" data-item-menu="${i.id}" aria-label="Options">${ic('more',16)}</button></span>
  </div>`;
}

/* ==================================================== 31. PANTRY ======== */
SCREENS.pantry = ()=>{
  const matches=S.pantry.length?pantryMatches():[];
  const exact=matches.filter(m=>m.missing===0);
  const near=matches.filter(m=>m.missing>0);
  const expiring=S.pantry.filter(p=>p.expiry).sort((a,b)=>a.expiry.localeCompare(b.expiry))
    .filter(p=>(new Date(p.expiry)-new Date(todayISO()))/86400000<=5);
  return `<div class="screen">
    ${topbar({title:'Pantry',actions:`<button class="iconbtn" data-add-pantry aria-label="Add an item">${ic('plus',20)}</button>`})}
    ${bigTitle('Pantry', S.pantry.length?`${S.pantry.length} ${plural(S.pantry.length,'thing')} in`:'')}
    <div class="grow pad">
      ${!S.pantry.length?emptyState({
        title:'What’s already in the house?',

/* =================================================== 22. COOKING MODE === */
function stepIngredients(r,step){
  const text=(step.text||'').toLowerCase();
  return allIngredients(r).filter(i=>{
    const n=normIng(i.name); if(!n||n.length<3) return false;
    const skip=new Set(['and','the','for','with','of','a','an','to','plus','more','into','cut']);
    return n.split(' ').some(w=>w.length>=3&&!skip.has(w)&&text.includes(w));
  });
}
SCREENS.cook = ({id})=>{
  const r=getRecipe(id);
  if(!r||!r.steps.length) return SCREENS.error({msg:'There’s no method to cook from yet.'});
  const c=S.ui.cook||(S.ui.cook={id,i:0,done:{},awake:false});
  const i=clamp(c.i,0,r.steps.length-1);
  const step=r.steps[i];
  const mult=(S.ui.mult&&S.ui.mult[id])||1;
  const rel=stepIngredients(r,step).map(x=>({...x,qty:mult!==1?scaleQty(x.qty,mult):x.qty}));
  const pct=((i+1)/r.steps.length)*100;
  const done=!!c.done[step.id];

  return `<div class="screen" style="background:var(--paper)">
    <div style="height:2px;background:var(--rule-soft);flex:0 0 auto">
      <div style="height:2px;width:${pct}%;background:var(--clay);transition:width .35s var(--ease)"></div></div>
    <header class="topbar" style="background:transparent">
      <button class="iconbtn" data-exit-cook aria-label="Leave cooking mode">${ic('close',20)}</button>
      <span class="micro" style="flex:1;text-align:center;opacity:1">Step ${i+1} of ${r.steps.length}</span>
      <span class="tb-act">
        <button class="iconbtn ${c.awake?'on':''}" data-awake aria-pressed="${c.awake}" aria-label="Keep screen awake">${ic('eye',20)}</button>
        <button class="iconbtn" data-cook-theme aria-label="${S.theme==='night'?'Day mode':'Night mode'}">${ic(S.theme==='night'?'sun':'moon',20)}</button>
        <button class="iconbtn" data-cook-ings="${r.id}" aria-label="Ingredients">${ic('library',20)}</button>
      </span>
    </header>

    <div class="grow pad" style="display:flex;flex-direction:column;padding-top:10px">
      <p class="micro">${esc(r.title)}</p>
      <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:22px 0">
        <p class="d2" style="font-size:clamp(25px,6.2vw,31px);line-height:1.3;font-weight:300;${done?'opacity:.4':''}">${esc(step.text)}</p>
        ${rel.length?`<div style="margin-top:30px;padding-top:18px;border-top:1px solid var(--rule)">
          <p class="micro" style="margin-bottom:10px">For this step</p>
          ${rel.map(x=>`<p class="body" style="margin:0 0 5px;color:var(--ink)">${x.qty?`<span class="num" style="font-weight:600">${esc(x.qty)}${x.unit?' '+esc(x.unit):''}</span> `:''}${esc(x.name)}</p>`).join('')}
        </div>`:''}
        ${step.time?`<div style="margin-top:26px"><button class="btn ghost sm" data-timer="${step.time}" style="width:auto">${ic('timer',16)} ${mins(step.time)} timer</button></div>`:''}
        ${r.notes&&i===0?`<div style="margin-top:26px;padding:16px 18px;background:var(--cream);border-radius:2px">
          <p class="micro" style="margin-bottom:6px">Your note on this recipe</p>
          <p class="serif-it" style="margin:0;font-size:15px;color:var(--ink-80)">${esc(r.notes)}</p></div>`:''}
      </div>
      ${S.ui.timers.length?`<div id="timerbar" style="padding-bottom:12px">${timersHtml()}</div>`:''}
    </div>

    <div style="flex:0 0 auto;border-top:1px solid var(--rule);padding:10px var(--pad) calc(12px + var(--safe-b));display:flex;gap:10px;align-items:stretch">
      <button class="btn ghost" data-cook-step="-1" ${i===0?'disabled':''} style="width:74px;flex:0 0 auto" aria-label="Previous step">${ic('back',20)}</button>
      <button class="btn ${done?'quiet':''}" data-cook-done="${step.id}" style="flex:1">${done?'Done ✓':'Mark done'}</button>
      ${i<r.steps.length-1
        ?`<button class="btn" data-cook-step="1" style="width:74px;flex:0 0 auto" aria-label="Next step">${ic('chev',20)}</button>`
        :`<button class="btn clay" data-finish-cook="${r.id}" style="width:auto;padding:0 20px">Finish</button>`}
    </div>
  </div>`;
};
function timersHtml(){
  return S.ui.timers.map(t=>{
    const left=Math.max(0,Math.round((t.end-Date.now())/1000));
    const m=Math.floor(left/60), s=left%60;
    return `<div class="ix-row" style="border-bottom:0;padding:9px 0;min-height:48px;border-top:1px solid var(--rule-soft)">
      <span class="ix-ic" style="color:${left?'var(--clay)':'var(--olive)'}">${ic('timer',18)}</span>
      <span class="ix-b"><span class="ix-t num" data-timer-id="${t.id}" style="font-family:var(--display);font-size:20px">${m}:${String(s).padStart(2,'0')}</span>
        <span class="ix-s">${esc(t.label)}</span></span>
      <span class="ix-r"><button class="iconbtn" style="width:38px;height:38px" data-timer-stop="${t.id}" aria-label="Stop timer">${ic('close',16)}</button></span>
    </div>`;
  }).join('');
}

/* ============================================= NUTRITION WORKSPACE ====== */
function energyLabel(kcal){
  if(kcal==null) return '—';
  return S.prefs.energyUnit==='kj' ? kj(kcal)+' kJ' : Math.round(kcal)+' kcal';
}
SCREENS.nutrition = ({id})=>{
  const r=getRecipe(id);
  if(!r) return SCREENS.error({msg:'That recipe is no longer in your library.'});
  const n=computeNutrition(r);
  const serves=parseQty(r.serves);
  const pct=Math.round(n.coverage*100);

  return `<div class="screen">
    ${topbar({close:true,title:'Calories'})}
    <div class="pad" style="padding-top:6px">
      <p class="micro">${esc(r.title)}</p>
      <h1 class="d2" style="margin-top:9px">${n.matched?energyLabel(n.perServe.kcal):'Not calculated yet'}<span class="mut">${n.matched&&serves?' per serve':''}</span></h1>
      ${!serves?`<p class="sm" style="margin:12px 0 0;color:var(--clay-ink)">Set how many this recipe serves and a per-serve figure becomes possible.</p>
        <button class="tbtn" data-set-serves="${r.id}" style="margin-top:12px">Set servings ${ic('chev',14,1.6)}</button>`
      : n.matched? `
        <p class="sm" style="margin:12px 0 0;max-width:34ch">
          ${n.complete
            ? `Computed from all ${n.total} ingredients, across ${n.gramsKnown} g of food, divided by ${esc(r.serves)} serves.`
            : `Computed from <strong style="color:var(--ink)">${n.matched} of ${n.total}</strong> ingredients. ${n.total-n.matched} ${plural(n.total-n.matched,'ingredient')} ${n.total-n.matched===1?'is':'are'} still unaccounted for, so this is a floor, not a total.`}
        </p>
        <div style="margin-top:16px;height:2px;background:var(--rule-soft)">
          <div style="height:2px;width:${pct}%;background:${n.complete?'var(--olive)':'var(--clay)'};transition:width .4s var(--ease)"></div></div>
        <p class="xs" style="margin-top:8px">${pct}% of ingredients accounted for</p>`
      : `<p class="sm" style="margin:12px 0 0;max-width:34ch">Match each ingredient to a food and ${BRANDS[S.brand].mark} will do the arithmetic. It will not estimate anything you haven't matched.</p>`}
    </div>

    ${n.matched?`<section class="sect pad">
      <div class="sect-head"><p class="micro">Per serve</p>
        <button class="micro ink" data-energy-unit style="min-height:38px">${S.prefs.energyUnit==='kj'?'Show kcal':'Show kJ'}</button></div>
      <div style="display:flex;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)">
        ${['kcal','protein','carbs','fat'].map(k=>`<div style="flex:1;padding:14px 0;text-align:center">
          <p class="micro" style="font-size:9px">${NUT_LABEL[k]}</p>
          <p class="stat" style="margin-top:6px">${n.perServe[k]==null?'—':(k==='kcal'?(S.prefs.energyUnit==='kj'?kj(n.perServe.kcal):Math.round(n.perServe.kcal)):Math.round(n.perServe[k])+'g')}</p></div>`).join('')}
      </div>
      ${n.complete?`<div style="margin-top:18px"><button class="btn" data-health-log="${r.id}">${ic('flame',16)} Send to Apple Health</button>
        <p class="xs" style="margin-top:10px;text-align:center">Strong reads dietary energy from Apple Health — this is how it gets there.</p></div>`
      :`<p class="xs" style="margin-top:14px;color:var(--clay-ink)">Sending to Health is disabled until every ingredient is accounted for. An incomplete figure logged as a real one is worse than no figure.</p>`}
    </section>`:''}

    <section class="sect pad">
      <div class="sect-head"><p class="micro">Ingredients</p>
        <span class="xs num">${n.matched}/${n.total}</span></div>
      <div class="ix">
        ${n.lines.map(l=>{
          const i=l.i;
          const qty=[i.qty,i.unit].filter(Boolean).join(' ');
          return `<button class="ix-row" data-match-ing="${r.id}:${i.id}" style="align-items:flex-start;padding:15px 0">
            <span class="ix-ic" style="padding-top:2px;color:${l.ok?'var(--olive-ink)':'var(--ink-30)'}">
              ${l.ok?ic('check',17,2):ic('plus',17)}</span>
            <span class="ix-b">
              <span class="ix-t">${qty?`<span class="num" style="font-weight:600">${esc(qty)}</span> `:''}${esc(i.name)}</span>
              ${l.ok
                ? `<span class="ix-s" style="white-space:normal">${esc(l.desc)}</span>
                   <span class="ix-s">${Math.round(l.grams)} g · ${energyLabel(l.values.kcal)} · ${esc(l.gramSource)}</span>`
                : `<span class="ix-s" style="color:var(--clay-ink)">${esc(l.why)}</span>`}
            </span>
            <span class="ix-r">${ic('chev',15,1.5)}</span></button>`;
        }).join('')}
      </div>
    </section>

    <section class="sect pad">
      <div class="sect-head"><p class="micro">Where these numbers come from</p></div>
      <p class="xs" style="max-width:38ch;margin:0 0 14px">
        Nutrient values: USDA FoodData Central, US public domain (CC0). Weights: either a mass you typed,
        a household portion USDA publishes for that exact food, or a gram weight you entered once.
        Nothing is modelled, averaged or inferred.
      </p>
      ${ixList([
        {title:'Override with the label instead',sub:r.nutritionMode==='manual'?'Currently using your own figures':'Type the numbers off the packet',icon:'edit',attrs:`data-nut-manual="${r.id}"`,n:false},
        {title:'Spoon sizes',sub:SPOON_SYSTEMS[S.prefs.spoons].label+' — '+SPOON_SYSTEMS[S.prefs.spoons].note,icon:'info',attrs:'data-go="nutritionsettings"',n:false},
        {title:'Clear all matches on this recipe',sub:'Start the matching again',icon:'trash',attrs:`data-nut-clear="${r.id}"`,n:false},
      ])}
    </section>
    <div style="height:34px"></div>
  </div>`;
};

/* ---- one ingredient: search, choose, weigh ---- */
function sheetMatch(recipeId,ingId){
  const r=getRecipe(recipeId); const i=allIngredients(r).find(x=>x.id===ingId);
  if(!i) return '';
  const st=S.ui.match||(S.ui.match={q:'',results:null,busy:false,err:'',sel:null});
  const g=ingredientGrams(i);
  const recalled=!i.nut&&recallFood(i.name);
  return `<div class="sheet-h"><h2 class="d4" style="max-width:15ch">${esc(i.name)}</h2>
    <button class="iconbtn" data-dismiss aria-label="Close">${ic('close',18)}</button></div>
  <div class="sheet-b">
    <p class="sm" style="margin:6px 0 16px">${[i.qty,i.unit].filter(Boolean).join(' ')||'no quantity'} — find the food this is, and we'll take its published values.</p>

    ${i.nut?`<div style="padding:14px 16px;background:var(--olive-wash);border-radius:2px;margin-bottom:18px">
      <p class="micro" style="color:var(--olive-ink);margin-bottom:6px">Matched</p>
      <p class="sm" style="margin:0;color:var(--ink)">${esc(i.nut.desc)}</p>
      <p class="xs" style="margin-top:6px">${i.nut.per100.kcal} kcal / 100 g · USDA #${i.nut.fdcId}</p>
      <p class="xs" style="margin-top:6px">${g?`${Math.round(g.grams)} g — ${esc(g.source)}`:'<span style="color:var(--clay-ink)">Still needs a weight for this quantity.</span>'}</p>
      <div style="display:flex;gap:16px;margin-top:10px">
        ${!g||!massToG(i.qty,i.unit)?`<button class="tbtn mutlink" data-set-grams="${recipeId}:${ingId}">${g?'Change weight':'Set the weight'}</button>`:''}
        <button class="tbtn mutlink" data-unmatch="${recipeId}:${ingId}">Remove match</button>
      </div>
    </div>`:''}

    ${recalled?`<div style="padding:14px 16px;box-shadow:inset 0 0 0 1px var(--rule);border-radius:2px;margin-bottom:18px">
      <p class="micro" style="margin-bottom:6px">You matched this before</p>
      <p class="sm" style="margin:0 0 10px;color:var(--ink)">${esc(recalled.desc)}</p>
      <button class="btn sm" data-use-recalled="${recipeId}:${ingId}">Use it again</button>
    </div>`:''}

    <div class="field focus" style="border-bottom-color:var(--ink)">
      <label class="micro">Search USDA FoodData Central</label>
      <input data-nut-q value="${esc(st.q||i.name)}" placeholder="olive oil" data-autofocus aria-label="Search foods">
    </div>
    <div style="margin-top:14px"><button class="btn" data-nut-search="${recipeId}:${ingId}" ${st.busy?'disabled':''}>${st.busy?'Searching…':'Search'}</button></div>

    ${st.err?`<div style="margin-top:16px;padding:14px 16px;background:var(--clay-wash);border-radius:2px">
      <p class="sm" style="margin:0;color:var(--ink)">${ic('warn',15)} ${esc(st.err)}</p>
      <button class="tbtn mutlink" data-manual-per100="${recipeId}:${ingId}" style="margin-top:8px">Type the values from the packet instead</button>
    </div>`:''}

    ${st.busy?`<div style="margin-top:20px">${[70,90,60].map(w=>`<div class="sk" style="height:14px;width:${w}%;margin-bottom:12px"></div>`).join('')}</div>`:''}

    ${st.results?(st.results.length?`<div style="margin-top:20px">
      <p class="micro" style="margin-bottom:8px">${st.results.length} ${plural(st.results.length,'match','matches')}</p>
      <div class="ix">${st.results.map((f,k)=>`<button class="ix-row" data-pick-food="${recipeId}:${ingId}:${k}" style="align-items:flex-start">
        <span class="ix-b"><span class="ix-t" style="font-weight:400">${esc(f.desc)}</span>
        <span class="ix-s">${f.per100.kcal} kcal · ${f.per100.protein??'—'}P ${f.per100.carbs??'—'}C ${f.per100.fat??'—'}F per 100 g · ${esc(f.type)}</span></span>
        <span class="ix-r">${ic('chev',15,1.5)}</span></button>`).join('')}</div>
    </div>`:`<p class="sm" style="margin-top:20px">Nothing came back for that. Try a plainer word — "tomatoes, canned" rather than a brand.</p>`):''}

    <div style="margin-top:24px;padding-top:18px;border-top:1px solid var(--rule)">
      <button class="tbtn mutlink" data-manual-per100="${recipeId}:${ingId}">Enter per-100 g values myself</button>
      <button class="tbtn mutlink" data-skip-ing="${recipeId}:${ingId}" style="display:block;margin-top:4px">Leave this one out</button>
      <p class="xs" style="margin-top:12px;max-width:36ch">Leaving one out is honest — the total will say it's incomplete rather than quietly pretending otherwise.</p>
    </div>
  </div>`;
}

/* ---- what we would write to Apple Health / Health Connect ---- */
function sheetHealth(recipeId,servings){
  const r=getRecipe(recipeId);
  const n=computeNutrition(r);
  const s=servings||1;
  const when=new Date().toISOString();
  const payload={
    platform: S.prefs.health.target==='apple'?'Apple HealthKit':'Android Health Connect',
    samples: S.prefs.health.target==='apple' ? [
      {type:'HKQuantityTypeIdentifierDietaryEnergyConsumed', unit:'kcal', value:round1(n.perServe.kcal*s)},
      {type:'HKQuantityTypeIdentifierDietaryProtein',        unit:'g',    value:round1(n.perServe.protein*s)},
      {type:'HKQuantityTypeIdentifierDietaryCarbohydrates',  unit:'g',    value:round1(n.perServe.carbs*s)},
      {type:'HKQuantityTypeIdentifierDietaryFatTotal',       unit:'g',    value:round1(n.perServe.fat*s)},
      {type:'HKQuantityTypeIdentifierDietaryFiber',          unit:'g',    value:round1(n.perServe.fibre*s)},
    ].filter(x=>x.value!=null) : [
      {record:'NutritionRecord', energy:round1(n.perServe.kcal*s)+' kcal',
       protein:round1(n.perServe.protein*s)+' g', totalCarbohydrate:round1(n.perServe.carbs*s)+' g',
       totalFat:round1(n.perServe.fat*s)+' g', dietaryFiber:round1(n.perServe.fibre*s)+' g'}
    ],
    metadata:{name:r.title, source:BRANDS[S.brand].mark, startTime:when, endTime:when, servings:s}
  };
  return `<div class="sheet-h"><h2 class="d4">Send to Health</h2>
    <button class="iconbtn" data-dismiss aria-label="Close">${ic('close',18)}</button></div>
  <div class="sheet-b">
    <p class="sm" style="margin:6px 0 18px;max-width:34ch">Strong doesn't take food data directly — it reads dietary energy and macros out of Apple Health on iOS, or Health Connect on Android. Write it there and it appears in Strong.</p>

    <div style="border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:16px 0;margin-bottom:18px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:14px">
        <span class="ix-t">Servings eaten</span>
        <span style="display:flex;align-items:center;gap:18px">
          <button class="iconbtn" data-health-serv="-1" aria-label="Fewer" style="box-shadow:inset 0 0 0 1px var(--rule)">${ic('minus',16)}</button>
          <span class="d3 num" aria-live="polite" style="min-width:2ch;text-align:center">${fmtQty(s)}</span>
          <button class="iconbtn" data-health-serv="1" aria-label="More" style="box-shadow:inset 0 0 0 1px var(--rule)">${ic('plus',16)}</button>
        </span>
      </div>
    </div>

    <div style="display:flex;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)">
      ${['kcal','protein','carbs','fat'].map(k=>`<div style="flex:1;padding:14px 0;text-align:center">
        <p class="micro" style="font-size:9px">${NUT_LABEL[k]}</p>
        <p class="stat" style="margin-top:6px">${n.perServe[k]==null?'—':(k==='kcal'?Math.round(n.perServe.kcal*s):Math.round(n.perServe[k]*s)+'g')}</p></div>`).join('')}
    </div>

    <p class="micro" style="margin:22px 0 8px">Exactly what gets written</p>
    <pre style="font-size:10.5px;line-height:1.6;background:var(--cream);padding:14px;border-radius:2px;overflow-x:auto;margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace">${esc(JSON.stringify(payload,null,2))}</pre>

    <div style="margin-top:20px;display:flex;flex-direction:column;gap:10px">
      <button class="btn" data-health-write="${recipeId}:${s}">Write to ${S.prefs.health.target==='apple'?'Apple Health':'Health Connect'}</button>
      <button class="btn ghost" data-health-copy="${recipeId}:${s}">Copy the payload</button>
      <button class="btn ghost" data-health-csv="${recipeId}:${s}">Download as CSV</button>
    </div>
    <p class="xs" style="margin-top:14px;max-width:38ch">In this browser prototype there is no HealthKit to write to, so "write" records the entry locally and shows you the result. In the built app this is a real HKQuantitySample.</p>
  </div>`;
}
function round1(v){ return v==null?null:Math.round(v*10)/10; }

function num(v){ const n=Number(v); return isNaN(n)?0:n; }
function setPath(obj,path,val){ const p=path.split('.'); let o=obj; while(p.length>1) o=o[p.shift()]; o[p[0]]=val; }
function toggleIn(arr,v){ const i=arr.indexOf(v); if(i<0) arr.push(v); else arr.splice(i,1); return arr; }
function copyText(t,label){
  const done=()=>toast(label||'Copied.');
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(t).then(done).catch(()=>fallback());
  else fallback();
  function fallback(){ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');done();}catch(e){toast('Couldn’t copy here.')} ta.remove(); }
}
function download(name,content,type='text/plain'){
  const b=new Blob([content],{type}); const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),2000);
}
function recipeAsText(r){
  const L=[]; L.push(r.title||'Untitled');
  if(r.description) L.push('',r.description);
  const at=[r.author,r.source].filter(Boolean).join(' — ');
  if(at||r.url) L.push('',`Source: ${at}${r.url?` (${r.url})`:''}`);
  const m=[r.prep?`Prep ${mins(r.prep)}`:'',r.cook?`Cook ${mins(r.cook)}`:'',r.serves?`Serves ${r.serves}`:''].filter(Boolean).join(' · ');
  if(m) L.push('',m);
  (r.groups||[]).filter(g=>g.items.length).forEach(g=>{
    L.push('', g.name?g.name.toUpperCase():'INGREDIENTS');
    g.items.forEach(i=>L.push(`- ${[i.qty,i.unit,i.name].filter(Boolean).join(' ')}`));
  });
  if(r.steps.length){ L.push('','METHOD'); r.steps.forEach((s,i)=>L.push(`${i+1}. ${s.text}`)); }
  if(r.notes) L.push('','NOTES',r.notes);
  [['STORAGE',r.storage],['REHEATING',r.reheat],['FREEZING',r.freezer],['SUBSTITUTIONS',r.subs]].forEach(([k,v])=>{ if(v) L.push('',k,v); });
  return L.join('\n');
}

/* ---------------------------------------------------------------- timers */
let timerInt=null;
function startTimer(secondsOrMin,label){
  const ms=secondsOrMin*60000;
  S.ui.timers.push({id:uid('t'),end:Date.now()+ms,label:label||mins(secondsOrMin)});
  toast(`${mins(secondsOrMin)} timer started.`);
  if(S.route.name==='cook') render(true); else openTimerBar();
  ensureTimerLoop();
}
function ensureTimerLoop(){
  if(timerInt) return;
  timerInt=setInterval(()=>{
    let fired=false;
    S.ui.timers.forEach(t=>{ if(!t.done&&Date.now()>=t.end){ t.done=true; fired=true; } });
    if(fired){ haptic([120,80,120]); toast('Timer finished.'); }
    $$('[data-timer-id]').forEach(el=>{
      const t=S.ui.timers.find(x=>x.id===el.dataset.timerId); if(!t) return;
      const left=Math.max(0,Math.round((t.end-Date.now())/1000));
      el.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
      if(!left) el.style.color='var(--olive)';
    });
    const fl=$('#floatTimers'); if(fl) fl.innerHTML=timersHtml();
    if(!S.ui.timers.length){ clearInterval(timerInt); timerInt=null; }
  },1000);
}
function openTimerBar(){
  if($('#floatTimerWrap')) return;
  const d=document.createElement('div');
  d.id='floatTimerWrap';
  d.style.cssText='position:absolute;left:var(--pad);right:var(--pad);bottom:calc(var(--tab-h) + var(--safe-b) + 12px);z-index:55;background:var(--paper);box-shadow:0 8px 26px -10px rgba(40,36,28,.4);padding:2px 14px;border:1px solid var(--rule)';
  d.innerHTML='<div id="floatTimers"></div>';
  $('#device').appendChild(d);
}
function syncTimerBar(){
  const w=$('#floatTimerWrap');
  if(!S.ui.timers.length){ if(w) w.remove(); return; }
  if(S.route.name==='cook'){ if(w) w.remove(); return; }
  openTimerBar(); const fl=$('#floatTimers'); if(fl) fl.innerHTML=timersHtml();
}

let wakeLock=null;
async function setAwake(on){
  try{
    if(on&&'wakeLock' in navigator){ wakeLock=await navigator.wakeLock.request('screen'); }
    else if(wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){ /* unsupported — the toggle still reflects intent */ }

/* ======================================================= EVENT WIRING === */
function wireEvents(){
  document.addEventListener('click',onClick);
  document.addEventListener('input',onInput);
  document.addEventListener('keydown',onKey);
}
function screenMounted(){
  syncTimerBar();
  if(S.route.name==='planner') wireDrag();
}
function wireDrag(){
  let dragged=null;
  $$('[data-entry]').forEach(el=>{
    el.addEventListener('dragstart',e=>{ dragged=el.dataset.entry; el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    el.addEventListener('dragend',()=>{ el.classList.remove('dragging'); $$('[data-day]').forEach(d=>d.classList.remove('drag-over')); });
  });
  $$('[data-day]').forEach(sec=>{
    sec.addEventListener('dragover',e=>{ e.preventDefault(); sec.classList.add('drag-over'); });
    sec.addEventListener('dragleave',()=>sec.classList.remove('drag-over'));
    sec.addEventListener('drop',e=>{
      e.preventDefault(); sec.classList.remove('drag-over');
      if(!dragged) return;
      const [from,eid]=dragged.split(':'); const to=sec.dataset.day;
      if(from===to) return;
      const i=(S.planner[from]||[]).findIndex(x=>x.id===eid); if(i<0) return;
      const [entry]=S.planner[from].splice(i,1);
      (S.planner[to]=S.planner[to]||[]).push(entry);
      dragged=null; render(true); toast('Moved.');
    });
  });
}

function onInput(e){
  scheduleSave();
  const t=e.target;
  const f=t.closest('.field'); if(f) f.classList.add('focus');
  if(t.hasAttribute('data-grow')) autogrow(t);

  if(t.dataset.q!==undefined){ S.ui.q=t.value; debounceRender(); return; }
  if(t.dataset.importUrl!==undefined){ S.ui.importUrl=t.value; debounceRender(); return; }
  if(t.dataset.pasteIn!==undefined){ S.ui.pasteText=t.value; return; }
  if(t.dataset.pickFilter!==undefined){
    const v=t.value.toLowerCase();
    $$('#pickList .ix-row').forEach(r=>{ r.style.display=r.dataset.name.includes(v)?'':'none'; });
    return;
  }
  if(t.dataset.onb!==undefined){ S.prefs[t.dataset.onb]=t.value; const b=$('[data-onb-next]'); if(b) b.disabled=false; return; }

  const r=S.ui.editing;
  if(t.dataset.f!==undefined&&r){ r[t.dataset.f]=t.value; return; }
  if(t.dataset.fn!==undefined&&r){ r.nutrition[t.dataset.fn]=t.value; return; }
  if(t.dataset.fg!==undefined&&r){ r.groups[num(t.dataset.fg)].name=t.value; return; }
  if(t.dataset.fs!==undefined&&r){ const s=r.steps[num(t.dataset.fs)]; s.text=t.value; s.time=extractStepTime(t.value); return; }
  if(t.dataset.fi!==undefined&&r){ const [g,i,k]=t.dataset.fi.split(':'); r.groups[num(g)].items[num(i)][k]=t.value; return; }

  const rev=S.imports.find(x=>x.id===(S.route.params||{}).id);
  if(t.dataset.rf!==undefined&&rev){ rev[t.dataset.rf]=t.value;
    rev.incomplete=(rev.incomplete||[]).filter(k=>!(k===t.dataset.rf||(k==='time'&&t.dataset.rf==='cook')));
    const btn=$('[data-review-save]'); if(btn) btn.disabled=!rev.title.trim(); return; }

  if(t.dataset.cf!==undefined&&S.ui.collectionDraft){ S.ui.collectionDraft[t.dataset.cf]=t.value;
    const b=$('[data-save-collection]'); if(b) b.disabled=!S.ui.collectionDraft.name.trim(); return; }
  if(t.dataset.pf!==undefined){ S.prefs[t.dataset.pf]=t.value; return; }
  if(t.dataset.cl!==undefined&&S.ui.cookLog){ S.ui.cookLog[t.dataset.cl]=t.value; return; }
}
let dbTimer=null;
function debounceRender(){
  clearTimeout(dbTimer);
  dbTimer=setTimeout(()=>{
    const a=document.activeElement; const sel=a&&a.dataset?Object.keys(a.dataset)[0]:null; const val=a?a.value:null;
    render(true);
    if(sel){ const n=$(`[data-${sel.replace(/[A-Z]/g,m=>'-'+m.toLowerCase())}]`); if(n){ n.focus(); try{n.setSelectionRange(val.length,val.length)}catch(e){} } }
  },260);
}
function onKey(e){
  if(e.key==='Escape'&&layerStack.length){ closeLayer(); return; }
  const t=e.target;
  if(e.key==='Enter'){
    if(t.dataset.onbTag!==undefined){ e.preventDefault(); const k=t.dataset.onbTag; const v=t.value.trim();
      if(v){ S.prefs[k]=[...(S.prefs[k]||[]),v]; t.value=''; render(true); } return; }
    if(t.dataset.tagIn!==undefined){ e.preventDefault(); const v=t.value.trim();
      if(v&&S.ui.editing&&!S.ui.editing.tags.includes(v)){ S.ui.editing.tags.push(v); t.value=''; render(true);} return; }
    if(t.dataset.ptag!==undefined){ e.preventDefault(); const k=t.dataset.ptag; const v=t.value.trim();
      if(v){ S.prefs[k]=[...(S.prefs[k]||[]),v]; t.value=''; render(true);} return; }
  }
}
